                          w.scanTimeNanos > 0
                            ? w.outputBytes / (w.scanTimeNanos / 1e9)
                            : 0;
                        return `<tr>
                             <td>${Utils.escapeHtml(w.workerId)}</td>
                             <td style="text-align: right;">${Utils.formatNumber(w.outputRows)}</td>
                             <td style="text-align: right;">${Utils.formatBytes(w.rawInputBytes)}</td>
                             <td style="text-align: right;">${Utils.formatBytes(w.outputBytes)}</td>
                             <td style="text-align: right;">${w.scanBatches}</td>
                             <td style="text-align: right;">${Utils.formatBytes(throughput)}/s</td>
                             <td style="text-align: right;">${Utils.formatDuration(w.scanTimeNanos)}</td>
                             <td style="text-align: right;">${Utils.formatDuration(w.blockedWallNanos)}</td>
                             <td style="text-align: right;">${Utils.formatDuration(w.getOutputWallNanos)}</td>
                           </tr>`;
                      })
                      .join("");

                    // Calculate totals
                    const totalScanTime = scanOp.scanTimeSum;
                    const totalInputRows = scanOp.rowsSum;
                    const totalRawInputBytes = scanOp.rawInputBytesSum;
                    const totalOutputBytes = scanOp.bytesSum || 0;
                    const totalBatches = scanOp.scanBatchesSum;
                    const throughput =
                      totalScanTime > 0
                        ? totalOutputBytes / (totalScanTime / 1e9)
                        : 0;
                    const minBlocked = scanOp.blockedWallMin || 0;
                    const maxGetOutputWall = scanOp.getOutputWallMax || 0;

                    // Labels for the first line (right-aligned on operator type row)
                    tableScanLabelsHtml = `
                         <span class="tablescan-stat-label rows">${Utils.formatNumber(totalInputRows)} rows</span>
                         <span class="tablescan-stat-label bytes">${Utils.formatBytes(totalRawInputBytes)} → ${Utils.formatBytes(totalOutputBytes)}</span>
                         <span class="tablescan-stat-label batches">${totalBatches} batches</span>
                         <span class="tablescan-stat-label throughput">${Utils.formatBytes(throughput)}/s</span>
                       `;

                    tableScanStatsHtml = `
                         <div class="explain-operator-details tablescan-stats-container" style="font-size: 11px; color: var(--text-muted); margin-top: 4px;">
                           <div class="tablescan-stats-detail">
                             <table style="width: 100%; border-collapse: collapse; font-size: 10px;">
                               <thead>
                                 <tr style="border-bottom: 1px solid var(--border-secondary);">
                                   <th style="text-align: left; padding: 2px 4px;">Worker</th>
                                   <th style="text-align: right; padding: 2px 4px;">Rows</th>
                                   <th style="text-align: right; padding: 2px 4px;">Input</th>
                                   <th style="text-align: right; padding: 2px 4px;">Output</th>
                                   <th style="text-align: right; padding: 2px 4px;">Batches</th>
                                   <th style="text-align: right; padding: 2px 4px;">Throughput</th>
                                   <th style="text-align: right; padding: 2px 4px;">Scan</th>
                                   <th style="text-align: right; padding: 2px 4px;">Blocked</th>
                                   <th style="text-align: right; padding: 2px 4px;">Wall</th>
                                 </tr>
                               </thead>
                               <tbody>
                                 ${workerTableRows}
                               </tbody>
                             </table>
                           </div>
                         </div>
                       `;
                  }
                }

                // Build Filter-specific stats HTML
                // (isFilter already defined above for opInfoHtml)
                let filterStatsHtml = "";
                let filterPushedDown = false;

                // Check if filter was pushed down (no runtime stats and source is TableScan)
                if (isFilter && operatorInfos.length === 0) {
                  const sourceType = node.source?.["@type"] || "";
                  if (sourceType.includes("TableScanNode")) {
                    filterPushedDown = true;
                  }
                }

                let filterLabelsHtml = "";
                if (isFilter && operatorInfos.length > 0) {
                  // For filters, show selectivity, row counts between operators, and timing
                  // Get the first operator (usually the actual filter operator)
                  const firstOp = operatorInfos[0];
                  const lastOp = operatorInfos[operatorInfos.length - 1];

                  const inputRows = firstOp.inputRowsSum || 0;
                  const outputRows = lastOp.rowsSum || 0;
                  const selectivity =
                    inputRows > 0 ? (outputRows / inputRows) * 100 : 100;

                  // Labels for the first line (right-aligned)
                  filterLabelsHtml = `
                       <span class="tablescan-stat-label rows">${Utils.formatNumber(inputRows)} → ${Utils.formatNumber(outputRows)} rows</span>
                       <span class="tablescan-stat-label batches">${selectivity.toFixed(1)}%</span>
                     `;

                  // Per-worker details are now embedded in opInfoHtml above
                  // No separate filterStatsHtml needed
                }

                // Build Project-specific labels
                let projectLabelsHtml = "";
                if (isProject && operatorInfos.length > 0) {
                  const firstOp = operatorInfos[0];
                  const lastOp = operatorInfos[operatorInfos.length - 1];

                  const inputRows = firstOp.inputRowsSum || 0;
                  const outputRows = lastOp.rowsSum || 0;
                  const inputBytes = firstOp.inputBytesSum || 0;
                  const outputBytes = lastOp.bytesSum || 0;

                  // Labels for the first line (right-aligned)
                  projectLabelsHtml = `
                       <span class="tablescan-stat-label rows">${Utils.formatNumber(inputRows)} → ${Utils.formatNumber(outputRows)} rows</span>
                       <span class="tablescan-stat-label bytes">${Utils.formatBytes(inputBytes)} → ${Utils.formatBytes(outputBytes)}</span>
                     `;
                }

                // Build RemoteSource-specific labels and stats
                let remoteSourceLabelsHtml = "";
                let remoteSourceStatsHtml = "";
                if (isRemoteSource && operatorInfos.length > 0) {
                  const exchangeOp = operatorInfos[0]; // ExchangeOperator
                  const sourceStageIds = sourceFragmentIds.join(", ");

                  // Calculate totals
                  const totalRows = exchangeOp.rowsSum || 0;
                  const totalBytes = exchangeOp.bytesSum || 0;

                  // Source stage badge and labels
                  remoteSourceLabelsHtml = `
                       <span class="remotesource-source-badge">← Stage ${sourceStageIds}</span>
                       <span class="tablescan-stat-label rows">${Utils.formatNumber(totalRows)} rows</span>
                       <span class="tablescan-stat-label bytes">${Utils.formatBytes(totalBytes)}</span>
                     `;

                  // Per-worker details table
                  const workerDetails = exchangeOp.workerDetails || [];
                  if (workerDetails.length > 0) {
                    const workerRows = workerDetails
                      .map((w) => {
                        const workerBlocked = w.blockedWallNanos || 0;
                        // Active time = getOutputWall (processing time), NOT getOutput - blocked
                        // blockedWall is separate wait time, getOutputWall is actual work time
                        const workerActive = w.getOutputWallNanos || 0;
                        const workerThroughput =
                          workerActive > 0
                            ? w.outputBytes / (workerActive / 1e9)
                            : 0;
                        return `<tr>
                             <td>${Utils.escapeHtml(w.workerId)}</td>
                             <td style="text-align: right;">${Utils.formatNumber(w.outputRows)}</td>
                             <td style="text-align: right;">${Utils.formatBytes(w.outputBytes)}</td>
                             <td style="text-align: right;">${Utils.formatDuration(workerBlocked)}</td>
                             <td style="text-align: right;">${Utils.formatDuration(workerActive)}</td>
                             <td style="text-align: right;">${Utils.formatBytes(workerThroughput)}/s</td>
                           </tr>`;
                      })
                      .join("");

                    remoteSourceStatsHtml = `
                         <div class="remotesource-stats-detail">
                           <table style="width: 100%; border-collapse: collapse; font-size: 10px;">
                             <thead>
                               <tr style="border-bottom: 1px solid var(--border-secondary);">
                                 <th style="text-align: left; padding: 2px 4px;">Worker</th>
                                 <th style="text-align: right; padding: 2px 4px;">Rows</th>
                                 <th style="text-align: right; padding: 2px 4px;">Bytes</th>
                                 <th style="text-align: right; padding: 2px 4px;">Blocked</th>
                                 <th style="text-align: right; padding: 2px 4px;">Active</th>
                                 <th style="text-align: right; padding: 2px 4px;">Throughput</th>
                               </tr>
                             </thead>
                             <tbody>
                               ${workerRows}
                             </tbody>
                           </table>
                         </div>
                       `;
                  }
                }

                const hasTableScanDetails = tableScanStatsHtml.includes(
                  "tablescan-stats-detail",
                );
                const hasRemoteSourceDetails = remoteSourceStatsHtml.includes(
                  "remotesource-stats-detail",
                );
                const hasFilterOpDetails =
                  opInfoHtml.includes("filter-op-details");
                const hasExpandableDetails =
                  hasTableScanDetails ||
                  hasFilterOpDetails ||
                  hasRemoteSourceDetails;
                const expandableClass = hasExpandableDetails
                  ? " expandable"
                  : "";
                // Click handler: for TableScan toggle single detail, for Filter toggle all op details
                let clickHandler = "";
                if (hasTableScanDetails) {
                  clickHandler = ` onclick="const detail = this.querySelector('.tablescan-stats-detail'); if(detail) detail.classList.toggle('expanded');"`;
                } else if (hasFilterOpDetails) {
                  clickHandler = ` onclick="this.querySelectorAll('.filter-op-details').forEach(d => d.classList.toggle('expanded'));"`;
                } else if (hasRemoteSourceDetails) {
                  clickHandler = ` onclick="const detail = this.querySelector('.remotesource-stats-detail'); if(detail) detail.classList.toggle('expanded');"`;
                }

                const pushedDownBadge = filterPushedDown
                  ? '<span class="filter-pushed-down-badge">pushed down</span>'
                  : "";

                // Combine labels (tableScan, filter, project, or remoteSource)
                const statsLabelsHtml =
                  tableScanLabelsHtml ||
                  filterLabelsHtml ||
                  projectLabelsHtml ||
                  remoteSourceLabelsHtml;

                // Build data attributes for RemoteSource linking
                const remoteSourceDataAttrs = isRemoteSource
                  ? ` data-source-stages="${sourceFragmentIds.join(",")}"`
                  : "";

                let html = `
                     <div class="explain-operator${isRemoteSource ? " remotesource-operator" : ""}" data-node-id="${nodeId}" data-stage-id="${stageId}"${remoteSourceDataAttrs} onmouseenter="App.highlightPlanNode(${nodeId}, &quot;tree&quot;${isRemoteSource ? `, [${sourceFragmentIds.join(",")}]` : ""})" onmouseleave="App.unhighlightPlanNode()" style="margin-left: ${indent * 10}px;">
                       <div class="explain-operator-main${expandableClass}"${clickHandler}>
                         <div class="explain-operator-type" style="display: flex; justify-content: space-between; align-items: center;">
                           <span>
                             ${Utils.escapeHtml(typeName)}
                             <span class="explain-node-id">#${nodeId}</span>
                           </span>
                           ${statsLabelsHtml ? `<span style="display: flex; gap: 4px;">${statsLabelsHtml}</span>` : ""}
                           ${pushedDownBadge}
                         </div>
                         ${operatorInfos.length > 0 ? `<div class="explain-operator-details">${opInfoHtml}</div>` : ""}
                         ${tableScanStatsHtml}
                         ${filterStatsHtml}
                         ${remoteSourceStatsHtml}
                       </div>
                     </div>
                   `;

                // If this is a RemoteSource, inline the source stages directly
                if (isRemoteSource && sourceFragmentIds.length > 0) {
                  sourceFragmentIds.forEach((fragId) => {
                    const sourceStageId = parseInt(fragId, 10);
                    const sourceStage =
                      this.findStageById(stage, sourceStageId) ||
                      this.findStageInSubstages(
                        model.raw.query.outputStage,
                        sourceStageId,
                      );
                    if (sourceStage) {
                      html += `<div style="margin-left: ${(indent + 1) * 10}px;">`;
                      html += renderStageTree(sourceStage, depth + 1);
                      html += `</div>`;
                    }
                  });
                } else {
                  // Recurse into children
                  const childKeys = [
                    "source",
                    "left",
                    "right",
                    "input",
                    "sources",
                    "filteringSource",
                    "probeSource",
                    "buildSource",
                  ];
                  childKeys.forEach((key) => {
                    if (node[key]) {
                      if (Array.isArray(node[key])) {
                        node[key].forEach((child) => {
                          html += renderPlanNode(child, indent + 1);
                        });
                      } else if (typeof node[key] === "object") {
                        html += renderPlanNode(node[key], indent + 1);
                      }
                    }
                  });
                }

                return html;
              };

              // Build pipeline timeline visualization
              // Collect operator timing from all tasks for this stage
              const pipelineTimeline = (() => {
                // Get all pipelines for this stage from tasks
                const stagePipelines = [];
                stageTasks.forEach((task) => {
                  const taskData = model.raw.tasks?.[task.workerHost]?.find(
                    (t) => t.taskId === task.taskId,
                  );
                  if (!taskData?.stats?.pipelines) return;

                  taskData.stats.pipelines.forEach((pipeline) => {
                    if (pipeline.operatorSummaries?.[0]?.stageId !== stageId)
                      return;

                    const pipelineStart = pipeline.firstStartTimeInMillis || 0;
                    const pipelineEnd = pipeline.lastEndTimeInMillis || 0;
                    const pipelineDuration = pipelineEnd - pipelineStart;

                    if (pipelineDuration <= 0) return;

                    const operators = pipeline.operatorSummaries.map((op) => {
                      // Parse wall time strings to nanoseconds
                      const parseTime = (str) => {
                        if (!str) return 0;
                        const match = str.match(/([0-9.]+)/);
                        return match ? parseFloat(match[1]) : 0;
                      };

                      return {
                        opId: op.operatorId,
                        planNodeId: op.planNodeId,
                        type: op.operatorType,
                        getOutputWallNs: parseTime(op.getOutputWall),
                        addInputWallNs: parseTime(op.addInputWall),
                        blockedWallNs: parseTime(op.blockedWall),
                      };
                    });

                    stagePipelines.push({
                      taskId: task.taskId,
                      workerId: task.workerHost,
                      pipelineId: pipeline.pipelineId,
                      startMs: pipelineStart,
                      endMs: pipelineEnd,
                      durationMs: pipelineDuration,
                      operators,
                    });
                  });
                });

                if (stagePipelines.length === 0) return "";

                // Find the overall time range across all pipelines
                const minStart = Math.min(
                  ...stagePipelines.map((p) => p.startMs),
                );
                const maxEnd = Math.max(...stagePipelines.map((p) => p.endMs));
                const totalDuration = maxEnd - minStart;

                if (totalDuration <= 0) return "";

                // Operator colors
                const opColors = {
                  TableScanOperator: "#3b82f6",
                  CudfFilterProject: "#22c55e",
                  CudfToVelox: "#f59e0b",
                  VeloxToCudf: "#f59e0b",
                  PartitionedOutput: "#ef4444",
                  Exchange: "#8b5cf6",
                  LocalExchange: "#8b5cf6",
                  HashBuild: "#ec4899",
                  HashProbe: "#14b8a6",
                  HashAggregation: "#06b6d4",
                  OrderBy: "#84cc16",
                  default: "#6b7280",
                };

                const getOpColor = (type) => {
                  for (const [key, color] of Object.entries(opColors)) {
                    if (type.includes(key)) return color;
                  }
                  return opColors.default;
                };

                // Build timeline rows - one per operator type across all workers
                // Aggregate operators by type
                const operatorsByType = new Map();
                stagePipelines.forEach((pipeline) => {
                  pipeline.operators.forEach((op) => {
                    const key = op.type;
                    if (!operatorsByType.has(key)) {
                      operatorsByType.set(key, {
                        type: op.type,
                        planNodeId: op.planNodeId,
                        totalGetOutputNs: 0,
                        totalBlockedNs: 0,
                        maxGetOutputNs: 0,
                        instances: [],
                      });
                    }
                    const agg = operatorsByType.get(key);
                    agg.totalGetOutputNs += op.getOutputWallNs;
                    agg.totalBlockedNs += op.blockedWallNs;
                    agg.maxGetOutputNs = Math.max(
                      agg.maxGetOutputNs,
                      op.getOutputWallNs,
                    );
                    agg.instances.push({ ...op, pipeline });
                  });
                });

                // Sort operators by their position in pipeline (first operator first)
                const sortedOps = [...operatorsByType.values()].sort((a, b) => {
                  const aFirst = a.instances[0];
                  const bFirst = b.instances[0];
                  return aFirst.opId - bFirst.opId;
                });

                // For visualization, we'll show cumulative time bars
                // Since times are cumulative per operator, we show them as proportions of total
                const totalOpTimeNs = sortedOps.reduce(
                  (sum, op) => sum + op.maxGetOutputNs,
                  0,
                );

                // Generate timeline rows
                let accumulatedPct = 0;
                const rows = sortedOps
                  .map((op) => {
                    const opName = Utils.getOperatorDisplayName(op.type);
                    const activeTimeNs =
                      op.maxGetOutputNs -
                      op.totalBlockedNs / op.instances.length;
                    const blockedTimeNs =
                      op.totalBlockedNs / op.instances.length;

                    // Calculate percentage of total pipeline time
                    const totalTimeNs = op.maxGetOutputNs;
                    const pctOfTotal =
                      totalDuration > 0
                        ? (totalTimeNs / 1e6 / totalDuration) * 100
                        : 0;
                    const blockedPct =
                      totalTimeNs > 0
                        ? (blockedTimeNs / totalTimeNs) * pctOfTotal
                        : 0;
                    const activePct = pctOfTotal - blockedPct;

                    const color = getOpColor(op.type);
                    const timeStr = Utils.formatDuration(totalTimeNs);

                    // For overlapping visualization, start each bar at accumulated position
                    // but operators can overlap, so we use their actual proportion
                    const barStart = accumulatedPct;

                    // Limit bar width to remaining space, but allow overlap visualization
                    const barWidth = Math.min(pctOfTotal, 100);

                    const row = `
                       <div class="stage-pipeline-timeline-row">
                         <div class="stage-pipeline-timeline-label" title="${Utils.escapeHtml(op.type)}">${Utils.escapeHtml(opName)}</div>
                         <div class="stage-pipeline-timeline-bar-container">
                           ${blockedPct > 0.5 ? `<div class="stage-pipeline-timeline-bar blocked" style="left: 0; width: ${barWidth}%; background-color: ${color};"></div>` : ""}
                           <div class="stage-pipeline-timeline-bar active" style="left: 0; width: ${activePct > 0.5 ? activePct : barWidth}%; background-color: ${color};">${barWidth > 10 ? opName : ""}</div>
                         </div>
                         <div class="stage-pipeline-timeline-time">${timeStr}</div>
                       </div>
                     `;

                    return row;
                  })
                  .join("");

                return `
                     <div class="stage-pipeline-timeline">
                       <div style="display: flex; justify-content: space-between; margin-bottom: 6px; color: var(--text-muted); font-size: 9px;">
                         <span>Pipeline Operators (cumulative wall time)</span>
                         <span>Total: ${Utils.formatDuration(totalDuration * 1e6)}</span>
                       </div>
                       ${rows}
                     </div>
                   `;
              })();

              return `
                   <div class="explain-stage" data-stage-id="${stageId}" style="border-color: ${color};"
                        onmouseenter="event.stopPropagation(); App.highlightStage(${stageId}, &quot;tree&quot;)" onmouseleave="event.stopPropagation(); App.unhighlightStage()">
                     <div class="explain-stage-header" style="background: ${color}20;">
                       <span class="badge" style="background: ${color}; color: white;">Stage ${stageId}</span>
                       <span style="margin-left: 8px; display: flex; gap: 8px;">
                         <span class="explain-worker-badge">
                           ${stageTasks.length} task${stageTasks.length !== 1 ? "s" : ""}
                         </span>
                         <span class="explain-worker-badge">
                           ${stageWorkerCount} worker${stageWorkerCount !== 1 ? "s" : ""}
                           <span class="worker-tooltip">${Utils.escapeHtml(stageWorkerList.join("\n"))}</span>
                         </span>
                       </span>
                       <span style="margin-left: auto; display: flex; gap: 4px; align-items: center;">
                         <span class="tablescan-stat-label rows">${Utils.formatNumber(stageMetrics.inputRows || 0)} → ${Utils.formatNumber(stageMetrics.outputRows || 0)} rows</span>
                         <span class="tablescan-stat-label bytes">${Utils.formatBytes(stageMetrics.inputBytes || 0)} → ${Utils.formatBytes(stageMetrics.outputBytes || 0)}</span>
                       </span>
                     </div>
                     ${pipelineTimeline}
                     <div class="explain-stage-content">
                       ${renderPlanNode(root)}
                     </div>
                   </div>
                 `;
            };

            // Helper to find a stage by ID in substages
            this.findStageInSubstages = (stage, targetId) => {
              if (!stage) return null;
              const stageId = parseInt(stage.stageId.split(".").pop(), 10);
              if (stageId === targetId) return stage;
              for (const sub of stage.subStages || []) {
                const found = this.findStageInSubstages(sub, targetId);
                if (found) return found;
              }
              return null;
            };

            this.findStageById = (currentStage, targetId) => {
              return null; // Use findStageInSubstages instead
            };

            // Build simple stage timeline
            // Use actual wall-clock timestamps from task stats
            // The model already has pre-computed timing relative to query start:
            // - stage.timing.relativeStartMs / relativeEndMs
            // - stage.workerTiming[worker].relativeActiveStartMs (when work actually started)
            // - model.queryTiming.durationMs

            const queryEndMs = model.queryTiming?.durationMs || 1;

            // Build timeline stages using actual timestamps
            const timelineStages = [];

            model.stages.forEach((stage, stageId) => {
              const color = stageColors[stageId] || "#4a9eff";
              const timing = stage.timing;

              if (!timing || timing.durationMs <= 0) return;

              // Find the earliest active start across all workers
              // This is when the stage actually started doing useful work
              let minActiveStartMs = Infinity;
              let workerCount = 0;

              stage.workerTiming.forEach((wt) => {
                if (
                  wt.relativeActiveStartMs !== undefined &&
                  wt.relativeActiveStartMs < minActiveStartMs
                ) {
                  minActiveStartMs = wt.relativeActiveStartMs;
                }
                workerCount++;
              });

              // If no active start found, use stage end (fully blocked)
              if (minActiveStartMs === Infinity) {
                minActiveStartMs = timing.relativeEndMs;
              }

              // Clamp to valid range
              const blockedStartMs = Math.max(0, timing.relativeStartMs);
              const activeStartMs = Math.max(
                blockedStartMs,
                Math.min(minActiveStartMs, timing.relativeEndMs),
              );
              const activeEndMs = Math.max(activeStartMs, timing.relativeEndMs);

              // Calculate durations for tooltip
              const initialBlockedMs = activeStartMs - blockedStartMs;
              const activeMs = activeEndMs - activeStartMs;
              const totalMs = activeEndMs - blockedStartMs;

              timelineStages.push({
                stageId: stageId,
                blockedStartMs: blockedStartMs,
                activeStartMs: activeStartMs,
                activeEndMs: activeEndMs,
                initialBlockedMs: initialBlockedMs,
                activeMs: activeMs,
                totalMs: totalMs,
                workerCount: workerCount || 1,
                color: color,
              });
            });

            // Calculate percentages
            timelineStages.forEach((stage) => {
              stage.blockedStartPct = (stage.blockedStartMs / queryEndMs) * 100;
              stage.activeStartPct = (stage.activeStartMs / queryEndMs) * 100;
              stage.activeEndPct = (stage.activeEndMs / queryEndMs) * 100;
              // Width of blocked segment (from blocked start to active start)
              stage.blockedWidthPct = Math.max(
                0,
                stage.activeStartPct - stage.blockedStartPct,
              );
              // Width of active segment
              stage.activeWidthPct = Math.max(
                0.5,
                stage.activeEndPct - stage.activeStartPct,
              );
            });

            // Sort stages in same order as tree view (depth-first from output stage)
            // Build tree traversal order by following remoteSources
            const stageOrder = new Map();
            let orderIndex = 0;

            const assignStageOrder = (stageData, visited = new Set()) => {
              if (!stageData) return;
              const stageId = parseInt(stageData.stageId.split(".").pop(), 10);
              if (visited.has(stageId)) return;
              visited.add(stageId);

              stageOrder.set(stageId, orderIndex++);

              // Follow subStages (these are the source stages in tree order)
              (stageData.subStages || []).forEach((subStage) => {
                assignStageOrder(subStage, visited);
              });
            };

            if (outputStage) {
              assignStageOrder(outputStage);
            }

            // Sort by tree order, fallback to stage ID
            timelineStages.sort((a, b) => {
              const orderA = stageOrder.get(a.stageId) ?? a.stageId;
              const orderB = stageOrder.get(b.stageId) ?? b.stageId;
              return orderA - orderB;
            });

            // Generate simple stage timeline HTML
            const timelineHtml =
              timelineStages.length > 0
                ? `
                 <div class="explain-timeline">
                   <div class="explain-timeline-content">
                     <div class="explain-timeline-axis">
                       <span>0</span>
                       <span>${Utils.formatDuration((queryEndMs / 4) * 1e6)}</span>
                       <span>${Utils.formatDuration((queryEndMs / 2) * 1e6)}</span>
                       <span>${Utils.formatDuration(((queryEndMs * 3) / 4) * 1e6)}</span>
                       <span>${Utils.formatDuration(queryEndMs * 1e6)}</span>
                     </div>
                     <div>
                       ${timelineStages
                         .map(
                           (stage) => `
                         <div class="explain-timeline-group" data-stage-id="${stage.stageId}"
                              onmouseenter="App.highlightStage(${stage.stageId}, &quot;timeline&quot;)"
                              onmouseleave="App.unhighlightStage()">
                           <div class="explain-timeline-row"
                                title="Stage ${stage.stageId} (${stage.workerCount} worker${stage.workerCount !== 1 ? "s" : ""}): total ${Utils.formatDuration(stage.totalMs * 1e6)} (blocked: ${Utils.formatDuration(stage.initialBlockedMs * 1e6)}, active: ${Utils.formatDuration(stage.activeMs * 1e6)})">
                             <div class="explain-timeline-label">Stage ${stage.stageId}</div>
                             <div class="explain-timeline-bar-container">
                               ${stage.blockedWidthPct > 0 ? `<div class="explain-timeline-bar-blocked" style="left: ${stage.blockedStartPct}%; width: ${stage.blockedWidthPct}%; background: repeating-linear-gradient(45deg, ${stage.color}40, ${stage.color}40 2px, transparent 2px, transparent 4px);"></div>` : ""}
                               <div class="explain-timeline-bar-active" style="left: ${stage.activeStartPct}%; width: ${stage.activeWidthPct}%; background: ${stage.color};"></div>
                             </div>
                           </div>
                         </div>
                       `,
                         )
                         .join("")}
                     </div>
                   </div>
                 </div>
               `
                : "";

            container.innerHTML = `
                 <div class="explain-container">
                   <div class="explain-timeline-pane">
                     <div class="view-link-toggle">
                       <button class="view-link-btn active" id="timeline-link-in" title="Respond to highlights from other views">
                         <span class="link-icon">&#8592;</span>IN
                       </button>
                       <button class="view-link-btn" id="timeline-link-out" title="Send highlights to other views">
                         OUT<span class="link-icon">&#8594;</span>
                       </button>
                     </div>
                     <div class="explain-timeline-content">
                       ${timelineHtml}
                     </div>
                   </div>
                   <div class="explain-divider-h" id="explain-divider-h"></div>
                   <div class="explain-main-area">
                     <div class="explain-split-container">
                       <div class="explain-tree-pane">
                         <div class="view-link-toggle">
                           <button class="view-link-btn active" id="tree-link-in" title="Respond to highlights from other views">
                             <span class="link-icon">&#8592;</span>IN
                           </button>
                           <button class="view-link-btn active" id="tree-link-out" title="Send highlights to other views">
                             OUT<span class="link-icon">&#8594;</span>
                           </button>
                         </div>
                         <div class="explain-tree">
                           ${renderStageTree(outputStage)}
                         </div>
                       </div>
                       <div class="explain-divider-v" id="explain-divider-v"></div>
                       <div class="explain-dag-pane">
                         <div class="view-link-toggle">
                           <button class="view-link-btn active" id="dag-link-in" title="Respond to highlights from other views">
                             <span class="link-icon">&#8592;</span>IN
                           </button>
                           <button class="view-link-btn" id="dag-link-out" title="Send highlights to other views">
                             OUT<span class="link-icon">&#8594;</span>
                           </button>
                         </div>
                         <div id="explain-dag-container"></div>
                       </div>
                     </div>
                   </div>
                 </div>
               `;

            // Setup resizable dividers
            this.setupExplainDividers();

            // Setup view link toggles
            this.setupViewLinkToggles();

            // Render the DAG in the right pane
            this.renderExplainDag(model, stageColors);
          },

          setupViewLinkToggles() {
            const toggles = [
              { id: "timeline-link-in", view: "timeline", dir: "in" },
              { id: "timeline-link-out", view: "timeline", dir: "out" },
              { id: "tree-link-in", view: "tree", dir: "in" },
              { id: "tree-link-out", view: "tree", dir: "out" },
              { id: "dag-link-in", view: "dag", dir: "in" },
              { id: "dag-link-out", view: "dag", dir: "out" },
            ];

            toggles.forEach(({ id, view, dir }) => {
              const btn = document.getElementById(id);
              if (btn) {
                // Set initial state from App.viewLinks
                if (App.viewLinks[view][dir]) {
                  btn.classList.add("active");
                } else {
                  btn.classList.remove("active");
                }

                btn.addEventListener("click", (e) => {
                  e.stopPropagation();
                  App.viewLinks[view][dir] = !App.viewLinks[view][dir];
                  btn.classList.toggle("active", App.viewLinks[view][dir]);
                });
              }
            });
          },

          setupExplainDividers() {
            const dividerH = document.getElementById("explain-divider-h");
            const dividerV = document.getElementById("explain-divider-v");
            const timelinePane = document.querySelector(
              ".explain-timeline-pane",
            );
            const treePane = document.querySelector(".explain-tree-pane");
            const splitContainer = document.querySelector(
              ".explain-split-container",
            );

            if (
              !dividerH ||
              !dividerV ||
              !timelinePane ||
              !treePane ||
              !splitContainer
            )
              return;

            // Horizontal divider (timeline height)
            let isDraggingH = false;
            let startY = 0;
            let startHeight = 0;

            dividerH.addEventListener("mousedown", (e) => {
              isDraggingH = true;
              startY = e.clientY;
              startHeight = timelinePane.offsetHeight;
              dividerH.classList.add("dragging");
              document.body.style.cursor = "row-resize";
              document.body.style.userSelect = "none";
              e.preventDefault();
            });

            // Vertical divider (tree/dag width)
            let isDraggingV = false;
            let startX = 0;
            let startWidth = 0;

            dividerV.addEventListener("mousedown", (e) => {
              isDraggingV = true;
              startX = e.clientX;
              startWidth = treePane.offsetWidth;
              dividerV.classList.add("dragging");
              document.body.style.cursor = "col-resize";
              document.body.style.userSelect = "none";
              e.preventDefault();
            });

            document.addEventListener("mousemove", (e) => {
              if (isDraggingH) {
                const delta = e.clientY - startY;
                const newHeight = Math.max(
                  80,
                  Math.min(startHeight + delta, window.innerHeight * 0.5),
                );
                timelinePane.style.height = `${newHeight}px`;
              }
              if (isDraggingV) {
                const delta = e.clientX - startX;
                const containerWidth = splitContainer.offsetWidth;
                const newWidth = Math.max(
                  200,
                  Math.min(startWidth + delta, containerWidth - 200 - 8),
                );
                treePane.style.width = `${newWidth}px`;
              }
            });

            document.addEventListener("mouseup", () => {
              if (isDraggingH) {
                isDraggingH = false;
                dividerH.classList.remove("dragging");
                document.body.style.cursor = "";
                document.body.style.userSelect = "";
              }
              if (isDraggingV) {
                isDraggingV = false;
                dividerV.classList.remove("dragging");
                document.body.style.cursor = "";
                document.body.style.userSelect = "";
                // Trigger DAG resize
                this.resizeExplainDag();
              }
            });
          },

          resizeExplainDag() {
            if (this.explainDagSelections && this.explainDagSelections.svg) {
              const dagContainer = document.getElementById(
                "explain-dag-container",
              );
              if (dagContainer) {
                const newWidth = dagContainer.clientWidth;
                const newHeight = dagContainer.clientHeight;
                this.explainDagSelections.svg
                  .attr("width", newWidth)
                  .attr("height", newHeight);
                this.explainDagSelections.width = newWidth;
                this.explainDagSelections.height = newHeight;
              }
            }
          },

          renderExplainDag(model, stageColors) {
            const container = document.getElementById("explain-dag-container");
            if (!container || typeof d3 === "undefined") return;

            const width = container.clientWidth || 500;
            const height = container.clientHeight || 600;

            // Clear previous content
            container.innerHTML = "";

            // Create custom tooltip element
            const tooltip = d3
              .select(container)
              .append("div")
              .attr("class", "dag-tooltip");

            const showTooltip = (event, html) => {
              const containerRect = container.getBoundingClientRect();
              const x = event.clientX - containerRect.left + 10;
              const y = event.clientY - containerRect.top + 10;

              tooltip
                .html(html)
                .style("left", `${x}px`)
                .style("top", `${y}px`)
                .classed("visible", true);
            };

            const hideTooltip = () => {
              tooltip.classed("visible", false);
            };

            const svg = d3
              .select(container)
              .append("svg")
              .attr("width", width)
              .attr("height", height);

            // Zoom/pan with trackpad-friendly behavior:
            // - Mouse drag or two-finger trackpad scroll = pan
            // - Trackpad pinch (ctrlKey) or Ctrl+wheel = zoom
            const g = svg.append("g");

            const zoom = d3
              .zoom()
              .scaleExtent([0.1, 4])
              .on("zoom", (event) => {
                g.attr("transform", event.transform);
              });

            svg.call(zoom).on("wheel.zoom", (event) => {
              event.preventDefault();
              const currentZoom = d3.zoomTransform(svg.node()).k;
              if (event.ctrlKey) {
                // Pinch or Ctrl+wheel = zoom under cursor
                const nextZoom =
                  currentZoom * Math.pow(2, -event.deltaY * 0.01);
                zoom.scaleTo(svg, nextZoom, d3.pointer(event));
              } else {
                // Two-finger trackpad scroll or mouse wheel = pan
                zoom.translateBy(
                  svg,
                  -event.deltaX / currentZoom,
                  -event.deltaY / currentZoom,
                );
              }
            });

            // Helper to get operator details for display
            const getNodeDetails = (n) => {
              const details = [];
              if (n.predicate) {
                const expr = DetailPanel.formatExpression(n.predicate);
                details.push(
                  `filter: ${expr.length > 40 ? expr.slice(0, 37) + "..." : expr}`,
                );
              }
              if (n.joinType) {
                details.push(n.joinType);
                // Add join criteria if available
                if (n.joinCriteria && n.joinCriteria.length > 0) {
                  const criteriaStr = n.joinCriteria
                    .map((c) => {
                      if (c.left && c.right) {
                        const leftName = c.left.name || c.left;
                        const rightName = c.right.name || c.right;
                        return `${leftName}=${rightName}`;
                      }
                      return DetailPanel.formatExpression(c);
                    })
                    .join(", ");
                  if (criteriaStr.length > 30) {
                    details.push(criteriaStr.slice(0, 27) + "...");
                  } else {
                    details.push(criteriaStr);
                  }
                }
              }
              if (n.aggregationType) {
                details.push(n.aggregationType);
              }
              if (n.table || n.tableHandle) {
                const tableName = DetailPanel.getTableName(n) || "?";
                details.push(`table: ${tableName}`);
              }
              if (n.assignments && Object.keys(n.assignments).length > 0) {
                const numAssignments = Object.keys(n.assignments).length;
                details.push(
                  `${numAssignments} expr${numAssignments > 1 ? "s" : ""}`,
                );
              }
              if (n.count !== null && n.count !== undefined) {
                details.push(`limit: ${n.count}`);
              }
              return details.join(", ");
            };

            // Helper to format column info for tooltip
            const formatColumnsTooltip = (columns) => {
              if (!columns || columns.length === 0) return "";
              return columns.map((c) => `${c.name}: ${c.type}`).join("\n");
            };

            // Create links data with metrics and columns
            const links = model.planEdges.map((e) => ({
              source: e.source,
              target: e.target,
              type: e.type,
              rows: e.rows || 0,
              bytes: e.bytes || 0,
              batches: e.batches || 0,
              columns: e.columns || [],
            }));

            // Compute hierarchical layout positions with more vertical spacing for details
            const nodePositions = Views.computeHierarchicalLayout(
              model,
              width,
              height,
            );

            // Get the computed layout dimensions
            const layoutWidth = nodePositions._layoutWidth || width;
            const layoutHeight = nodePositions._layoutHeight || height;

            // Update SVG size to match layout
            svg.attr("width", layoutWidth).attr("height", layoutHeight);

            // Create nodes data with computed positions and details
            const nodes = model.planNodes.map((n) => ({
              ...n,
              x: nodePositions.get(n.id)?.x || layoutWidth / 2,
              y: nodePositions.get(n.id)?.y || layoutHeight / 2,
              details: getNodeDetails(n),
            }));

            // Create a map for quick node lookup by id
            const nodeById = new Map(nodes.map((n) => [n.id, n]));

            // Define arrow markers
            svg
              .append("defs")
              .selectAll("marker")
              .data(["local", "exchange"])
              .join("marker")
              .attr("id", (d) => `arrow-explain-${d}`)
              .attr("viewBox", "0 -5 10 10")
              .attr("refX", 10)
              .attr("refY", 0)
              .attr("markerWidth", 6)
              .attr("markerHeight", 6)
              .attr("orient", "auto")
              .append("path")
              .attr("fill", (d) => (d === "exchange" ? "#d216d2" : "#6a6a6a"))
              .attr("d", "M0,-5L10,0L0,5");

            // Get layout metadata
            const layers = nodePositions._layers || new Map();
            const augmentedEdges = nodePositions._augmentedEdges || [];

            // Build a map of all positions including dummy nodes
            const allPositions = new Map(nodePositions);

            // Resolve link source/target to actual node objects
            const resolvedLinks = links
              .map((l) => ({
                ...l,
                sourceNode: nodeById.get(l.source),
                targetNode: nodeById.get(l.target),
              }))
              .filter((l) => l.sourceNode && l.targetNode);

            // Node dimensions - taller to accommodate details
            const nodeWidth = 120;
            const nodeHeight = 50;
            const nodeHalfWidth = nodeWidth / 2;
            const nodeHalfHeight = nodeHeight / 2;

            // Build edge paths through dummy nodes for long edges
            // Group augmented edges by their original edge
            const edgePathsByOriginal = new Map();
            augmentedEdges.forEach((ae) => {
              const key = `${ae.original.source}->${ae.original.target}`;
              if (!edgePathsByOriginal.has(key)) {
                edgePathsByOriginal.set(key, {
                  original: ae.original,
                  segments: [],
                });
              }
              edgePathsByOriginal.get(key).segments.push(ae);
            });

            // For each original edge, collect all waypoints (dummy node positions)
            const edgeWaypoints = new Map();
            edgePathsByOriginal.forEach((data, key) => {
              const { original, segments } = data;
              // Build ordered list of node IDs from source to target
              const waypoints = [original.source];

              // Sort segments by source layer
              segments.sort((a, b) => {
                const layerA = layers.get(a.source) || 0;
                const layerB = layers.get(b.source) || 0;
                return layerA - layerB;
              });

              segments.forEach((seg) => {
                if (
                  seg.target !== original.target &&
                  !waypoints.includes(seg.target)
                ) {
                  waypoints.push(seg.target);
                }
              });
              waypoints.push(original.target);

              edgeWaypoints.set(key, waypoints);
            });

            // Helper to get waypoints for an edge
            const getEdgePoints = (d) => {
              const key = `${d.source}->${d.target}`;
              const waypoints = edgeWaypoints.get(key);

              if (!waypoints || waypoints.length <= 2) {
                // Simple edge between adjacent layers
                const x1 = d.sourceNode.x;
                const y1 = d.sourceNode.y - nodeHalfHeight;
                const x2 = d.targetNode.x;
                const y2 = d.targetNode.y + nodeHalfHeight + 6;
                return [
                  { x: x1, y: y1 },
                  { x: x2, y: y2 },
                ];
              }

              // Multi-segment path through dummy nodes
              const points = waypoints.map((id, idx) => {
                const pos = allPositions.get(id);
                if (!pos) return null;

                // First point: bottom of source node
                if (idx === 0) {
                  return { x: pos.x, y: pos.y - nodeHalfHeight };
                }
                // Last point: top of target node
                if (idx === waypoints.length - 1) {
                  return { x: pos.x, y: pos.y + nodeHalfHeight + 6 };
                }
                // Dummy nodes: use center
                return { x: pos.x, y: pos.y };
              });

              return points.filter((p) => p !== null);
            };

            // Generate path through waypoints using smooth curves
            const generateEdgePath = (d) => {
              const validPoints = getEdgePoints(d);

              if (validPoints.length < 2) {
                return `M 0 0`;
              }

              if (validPoints.length === 2) {
                const [p0, p1] = validPoints;
                if (Math.abs(p1.x - p0.x) < 5) {
                  return `M ${p0.x} ${p0.y} L ${p1.x} ${p1.y}`;
                }
                const midY = (p0.y + p1.y) / 2;
                return `M ${p0.x} ${p0.y} C ${p0.x} ${midY}, ${p1.x} ${midY}, ${p1.x} ${p1.y}`;
              }

              // For 3+ points, use polyline with rounded corners
              // This is more predictable than Catmull-Rom for label positioning
              let path = `M ${validPoints[0].x} ${validPoints[0].y}`;

              for (let i = 1; i < validPoints.length; i++) {
                const prev = validPoints[i - 1];
                const curr = validPoints[i];

                // Use quadratic bezier for smooth transitions
                if (i === 1) {
                  // First segment: curve from source
                  const midY = (prev.y + curr.y) / 2;
                  path += ` Q ${prev.x} ${midY}, ${curr.x} ${curr.y}`;
                } else if (i === validPoints.length - 1) {
                  // Last segment: curve to target
                  const prevPrev = validPoints[i - 2];
                  const midY = (prev.y + curr.y) / 2;
                  path += ` Q ${prev.x} ${midY}, ${curr.x} ${curr.y}`;
                } else {
                  // Middle segments: straight lines through dummy nodes
                  path += ` L ${curr.x} ${curr.y}`;
                }
              }

              return path;
            };

            // Calculate midpoint along the edge path for label positioning
            const getEdgeMidpoint = (d) => {
              const points = getEdgePoints(d);

              if (points.length < 2) {
                return { x: d.sourceNode.x, y: d.sourceNode.y };
              }

              if (points.length === 2) {
                // Simple midpoint for 2-point edges
                return {
                  x: (points[0].x + points[1].x) / 2,
                  y: (points[0].y + points[1].y) / 2,
                };
              }

              // For multi-segment edges, find the middle segment
              const midIdx = Math.floor(points.length / 2);
              const p1 = points[midIdx - 1];
              const p2 = points[midIdx];

              return {
                x: (p1.x + p2.x) / 2,
                y: (p1.y + p2.y) / 2,
              };
            };

            // Draw links as paths (curved)
            const link = g
              .append("g")
              .selectAll("path")
              .data(resolvedLinks)
              .join("path")
              .attr("fill", "none")
              .attr("stroke", (d) =>
                d.type === "exchange" ? "#d216d2" : "#4a5568",
              )
              .attr("stroke-width", (d) => (d.type === "exchange" ? 2 : 1.5))
              .attr("stroke-dasharray", (d) =>
                d.type === "exchange" ? "5,5" : "none",
              )
              .attr("marker-end", (d) => `url(#arrow-explain-${d.type})`)
              .attr("d", generateEdgePath);

            // Draw edge labels with rows, bytes, and column count
            const edgeLabel = g
              .append("g")
              .selectAll("g")
              .data(resolvedLinks)
              .join("g")
              .attr("class", "edge-label")
              .attr("cursor", "pointer")
              .attr("transform", (d) => {
                const mid = getEdgeMidpoint(d);
                return `translate(${mid.x},${mid.y})`;
              });

            // Add hover events for custom tooltip on edges
            edgeLabel
              .on("mouseenter", (event, d) => {
                if (d.columns && d.columns.length > 0) {
                  const colHtml = d.columns
                    .map(
                      (c) =>

          getPlanNodeDetails(node) {
            const details = [];
            if (node.joinType && node.type === "Join") {

          renderPlanDag(model, stageColors) {
            const container = document.getElementById("plan-dag-container");
            if (!container || typeof d3 === "undefined") return;

            const width = container.clientWidth || 800;
            const height = container.clientHeight || 600;

            // Clear previous content
            container.innerHTML = "";

            const svg = d3
              .select(container)
              .append("svg")
              .attr("width", width)
              .attr("height", height);

            // Zoom/pan with trackpad-friendly behavior:
            // - Mouse drag or two-finger trackpad scroll = pan
            // - Trackpad pinch (ctrlKey) or Ctrl+wheel = zoom
            const g = svg.append("g");

            const zoom = d3
              .zoom()
              .scaleExtent([0.1, 4])
              .on("zoom", (event) => {
                g.attr("transform", event.transform);
              });

            svg.call(zoom).on("wheel.zoom", (event) => {
              event.preventDefault();
              const currentZoom = d3.zoomTransform(svg.node()).k;
              if (event.ctrlKey) {
                // Pinch or Ctrl+wheel = zoom under cursor
                const nextZoom =
                  currentZoom * Math.pow(2, -event.deltaY * 0.01);
                zoom.scaleTo(svg, nextZoom, d3.pointer(event));
              } else {
                // Two-finger trackpad scroll or mouse wheel = pan
                zoom.translateBy(
                  svg,
                  -event.deltaX / currentZoom,
                  -event.deltaY / currentZoom,
                );
              }
            });

            // Build node map for quick lookup
            const nodeMap = new Map(model.planNodes.map((n) => [n.id, n]));

            const links = model.planEdges.map((e) => ({
              source: e.source,
              target: e.target,
              type: e.type,
              rows: e.rows || 0,
              bytes: e.bytes || 0,
              batches: e.batches || 0,
            }));

            // Compute hierarchical layout positions
            // Group nodes by stage, then compute depth within each stage
            const nodePositions = this.computeHierarchicalLayout(
              model,
              width,
              height,

            // Get the computed layout dimensions (may be larger than container)
            const layoutWidth = nodePositions._layoutWidth || width;
            const layoutHeight = nodePositions._layoutHeight || height;

            // Update SVG size to match layout
            svg.attr("width", layoutWidth).attr("height", layoutHeight);

            // Create nodes data with computed positions
            const nodes = model.planNodes.map((n) => ({
              ...n,
              x: nodePositions.get(n.id)?.x || layoutWidth / 2,
              y: nodePositions.get(n.id)?.y || layoutHeight / 2,

            // Create a map for quick node lookup by id
            const nodeById = new Map(nodes.map((n) => [n.id, n]));

              const emptyBbox = { x: 0, y: 0, width: 0, height: 0 };

              const boxes = [rowsBbox, bytesBbox, batchesBbox].filter(

              if (boxes.length === 0) return;
              const minX = Math.min(...boxes.map((b) => b.x));
              const minY = Math.min(...boxes.map((b) => b.y));
              const maxX = Math.max(...boxes.map((b) => b.x + b.width));
              const maxY = Math.max(...boxes.map((b) => b.y + b.height));
              d3.select(this)
                .select("rect")
                .attr("x", minX - 4)
                .attr("y", minY - 2)
                .attr("width", maxX - minX + 8)

              const scale = Math.min(

            App.planSelections = { node, link, edgeLabel, nodeById };
            App.planStageColors = stageColors;
          },

          /**
           * Sugiyama-style hierarchical layout algorithm
           * Based on: Sugiyama, Tagawa, Toda (1981)
           * With improvements from Gansner et al. and Brandes & Köpf
           *
           * Steps:
           * 1. Layer assignment (longest path)
           * 2. Dummy vertex insertion for long edges
           * 3. Crossing minimization (median heuristic + transpose)
           * 4. Coordinate assignment
           */
          computeHierarchicalLayout(model, width, height) {
            const positions = new Map();

            // ===== STEP 1: Build graph and assign layers =====
            const incomingEdges = new Map();
            const outgoingEdges = new Map();
            model.planNodes.forEach((n) => {
              incomingEdges.set(n.id, []);
              outgoingEdges.set(n.id, []);
            });
            model.planEdges.forEach((e) => {
              if (incomingEdges.has(e.target)) {
                incomingEdges.get(e.target).push(e.source);
              }
              if (outgoingEdges.has(e.source)) {
                outgoingEdges.get(e.source).push(e.target);
              }
            });

            // Assign layers using longest path from leaves
            const layers = new Map();
            const computeLayer = (nodeId, visited = new Set()) => {
              if (layers.has(nodeId)) return layers.get(nodeId);
              if (visited.has(nodeId)) return 0;
              visited.add(nodeId);

              const incoming = incomingEdges.get(nodeId) || [];
              if (incoming.length === 0) {
                layers.set(nodeId, 0);
                return 0;
              }

              const maxChildLayer = Math.max(
                ...incoming.map((srcId) => computeLayer(srcId, visited)),
              );
              const layer = maxChildLayer + 1;
              layers.set(nodeId, layer);
              return layer;
            };

            model.planNodes.forEach((n) => computeLayer(n.id));
            const maxLayer = Math.max(...layers.values(), 0);

            // ===== STEP 2: Insert dummy vertices for long edges =====
            // This ensures every edge only spans one layer
            let dummyId = 0;
            const dummyNodes = []; // { id, layer, stageId, isDummy, originalEdge }
            const augmentedEdges = []; // edges including dummy connections
            const originalEdgeSegments = new Map(); // originalEdge -> [segment ids]

            model.planEdges.forEach((edge) => {
              const sourceLayer = layers.get(edge.source) || 0;
              const targetLayer = layers.get(edge.target) || 0;
              const span = targetLayer - sourceLayer;

              if (span <= 1) {
                // Edge spans only one layer, keep as is
                augmentedEdges.push({
                  source: edge.source,
                  target: edge.target,
                  original: edge,
                });
              } else {
                // Long edge: insert dummy nodes
                const segments = [];
                let prevId = edge.source;

                for (let l = sourceLayer + 1; l < targetLayer; l++) {
                  const dummyNodeId = `__dummy_${dummyId++}`;
                  dummyNodes.push({
                    id: dummyNodeId,
                    layer: l,
                    stageId: edge.sourceStageId || edge.stageId,
                    isDummy: true,
                    originalEdge: edge,
                  });
                  layers.set(dummyNodeId, l);
                  incomingEdges.set(dummyNodeId, [prevId]);
                  outgoingEdges.set(dummyNodeId, []);

                  augmentedEdges.push({
                    source: prevId,
                    target: dummyNodeId,
                    original: edge,
                    isDummyEdge: true,
                  });
                  segments.push(dummyNodeId);

                  // Update previous node's outgoing
                  if (outgoingEdges.has(prevId)) {
                    const out = outgoingEdges.get(prevId);
                    const idx = out.indexOf(edge.target);
                    if (idx >= 0) out.splice(idx, 1);
                    out.push(dummyNodeId);
                  }

                  prevId = dummyNodeId;
                }

                // Final segment to actual target
                augmentedEdges.push({
                  source: prevId,
                  target: edge.target,
                  original: edge,
                  isDummyEdge: true,
                });
                outgoingEdges.get(prevId)?.push(edge.target);

                // Update target's incoming
                const targetIncoming = incomingEdges.get(edge.target);
                if (targetIncoming) {
                  const idx = targetIncoming.indexOf(edge.source);
                  if (idx >= 0) targetIncoming.splice(idx, 1);
                  targetIncoming.push(prevId);
                }

                originalEdgeSegments.set(edge, segments);
              }
            });

            // Combine real and dummy nodes
            const allNodes = [
              ...model.planNodes.map((n) => ({
                ...n,
                isDummy: false,
              })),
              ...dummyNodes,
            ];

            // Group all nodes by layer
            const nodesByLayer = new Map();
            allNodes.forEach((n) => {
              const layer = layers.get(n.id) || 0;
              if (!nodesByLayer.has(layer)) {
                nodesByLayer.set(layer, []);
              }
              nodesByLayer.get(layer).push(n);
            });

            // ===== STEP 3: Crossing minimization =====
            // Use median heuristic with transpose improvement

            // Helper: count crossings between adjacent layers
            const countCrossings = (layer1, layer2) => {
              const nodes1 = nodesByLayer.get(layer1) || [];
              const nodes2 = nodesByLayer.get(layer2) || [];
              if (nodes1.length === 0 || nodes2.length === 0) return 0;

              const edges = [];
              nodes1.forEach((n1, i1) => {
                const targets = outgoingEdges.get(n1.id) || [];
                targets.forEach((targetId) => {
                  const i2 = nodes2.findIndex((n2) => n2.id === targetId);
                  if (i2 >= 0) edges.push({ from: i1, to: i2 });
                });
              });

              let crossings = 0;
              for (let i = 0; i < edges.length; i++) {
                for (let j = i + 1; j < edges.length; j++) {
                  if (
                    (edges[i].from < edges[j].from &&
                      edges[i].to > edges[j].to) ||
                    (edges[i].from > edges[j].from && edges[i].to < edges[j].to)
                  ) {
                    crossings++;
                  }
                }
              }
              return crossings;
            };

            // Helper: get median of connected node positions
            const getMedian = (connectedIds, orderMap) => {
              const positions = connectedIds
                .map((id) => orderMap.get(id))
                .filter((p) => p !== undefined)
                .sort((a, b) => a - b);
              if (positions.length === 0) return null;
              const mid = Math.floor(positions.length / 2);
              return positions.length % 2 === 1
                ? positions[mid]
                : (positions[mid - 1] + positions[mid]) / 2;
            };

            // Initial ordering: group by stage, then by ID
            for (const [layer, nodes] of nodesByLayer) {
              nodes.sort((a, b) => {
                // Dummy nodes sort near their original edge's source
                const aStage = a.stageId ?? 999;
                const bStage = b.stageId ?? 999;
                if (aStage !== bStage) return aStage - bStage;
                return String(a.id).localeCompare(String(b.id));
              });
            }

            // Track node order within each layer
            const orderMap = new Map();
            for (const [layer, nodes] of nodesByLayer) {
              nodes.forEach((n, i) => orderMap.set(n.id, i));
            }

            // Iterative median heuristic (24 iterations, alternating sweeps)
            for (let iter = 0; iter < 24; iter++) {
              if (iter % 2 === 0) {
                // Down sweep
                for (let layer = 1; layer <= maxLayer; layer++) {
                  const nodes = nodesByLayer.get(layer) || [];
                  const medians = new Map();

                  nodes.forEach((n) => {
                    const incoming = incomingEdges.get(n.id) || [];
                    const med = getMedian(incoming, orderMap);
                    medians.set(n.id, med !== null ? med : orderMap.get(n.id));
                  });

                  nodes.sort(
                    (a, b) =>
                      (medians.get(a.id) ?? 0) - (medians.get(b.id) ?? 0),
                  );
                  nodes.forEach((n, i) => orderMap.set(n.id, i));
                }
              } else {
                // Up sweep
                for (let layer = maxLayer - 1; layer >= 0; layer--) {
                  const nodes = nodesByLayer.get(layer) || [];
                  const medians = new Map();

                  nodes.forEach((n) => {
                    const outgoing = outgoingEdges.get(n.id) || [];
                    const med = getMedian(outgoing, orderMap);
                    medians.set(n.id, med !== null ? med : orderMap.get(n.id));
                  });

                  nodes.sort(
                    (a, b) =>
                      (medians.get(a.id) ?? 0) - (medians.get(b.id) ?? 0),
                  );
                  nodes.forEach((n, i) => orderMap.set(n.id, i));
                }
              }
            }

            // Transpose: try swapping adjacent nodes to reduce crossings
            let improved = true;
            let transposeIter = 0;
            while (improved && transposeIter < 10) {
              improved = false;
              transposeIter++;

              for (let layer = 0; layer <= maxLayer; layer++) {
                const nodes = nodesByLayer.get(layer) || [];
                if (nodes.length < 2) continue;

                for (let i = 0; i < nodes.length - 1; i++) {
                  const crossingsBefore =
                    (layer > 0 ? countCrossings(layer - 1, layer) : 0) +
                    (layer < maxLayer ? countCrossings(layer, layer + 1) : 0);

                  // Swap
                  [nodes[i], nodes[i + 1]] = [nodes[i + 1], nodes[i]];
                  nodes.forEach((n, idx) => orderMap.set(n.id, idx));

                  const crossingsAfter =
                    (layer > 0 ? countCrossings(layer - 1, layer) : 0) +
                    (layer < maxLayer ? countCrossings(layer, layer + 1) : 0);

                  if (crossingsAfter < crossingsBefore) {
                    improved = true;
                  } else {
                    // Revert
                    [nodes[i], nodes[i + 1]] = [nodes[i + 1], nodes[i]];
                    nodes.forEach((n, idx) => orderMap.set(n.id, idx));
                  }
                }
              }
            }

            // ===== STEP 4: Coordinate assignment =====
            const margin = 50;
            const layerHeight = 180;
            const nodeSpacing = 130;

            // Find max width needed (only count real nodes for spacing calc)
            let maxNodesInLayer = 0;
            for (const [layer, nodes] of nodesByLayer) {
              maxNodesInLayer = Math.max(maxNodesInLayer, nodes.length);
            }

            const requiredWidth = margin * 2 + maxNodesInLayer * nodeSpacing;
            const requiredHeight = margin * 2 + (maxLayer + 1) * layerHeight;

            const layoutWidth = Math.max(width, requiredWidth);
            const layoutHeight = Math.max(height, requiredHeight);

            // Position each node (including dummies)
            for (const [layer, nodes] of nodesByLayer) {
              const layerWidth = nodes.length * nodeSpacing;
              const startX = (layoutWidth - layerWidth) / 2 + nodeSpacing / 2;
              const y = margin + (maxLayer - layer) * layerHeight;

              nodes.forEach((n, i) => {
                const x = startX + i * nodeSpacing;
                positions.set(n.id, { x, y, isDummy: n.isDummy });
              });
            }

            positions._layoutWidth = layoutWidth;
            positions._layoutHeight = layoutHeight;
            positions._layers = layers;
            positions._nodesByLayer = nodesByLayer;
            positions._augmentedEdges = augmentedEdges;
            positions._dummyNodes = dummyNodes;

            return positions;
          },
