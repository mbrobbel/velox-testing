    <!-- D3.js for visualizations -->
    <script src="https://d3js.org/d3.v7.min.js"></script>

    <script>
      /* =============================================================================
      Presto Metrics Viewer - Main Application
      ============================================================================= */

      (function () {
        "use strict";

        // ==========================================================================
        // Utility Functions
        // ==========================================================================

        const Utils = {
          /**
           * Parse a time string like "405330.00ns" or "2.38s" to nanoseconds
           */
          parseTimeToNanos(str) {
            if (!str || str === "0.00ns") return 0;
            const match = str.match(/^([\d.]+)\s*(ns|us|ms|s|m|h)$/i);
            if (!match) return 0;

            const value = parseFloat(match[1]);
            const unit = match[2].toLowerCase();

            const multipliers = {
              ns: 1,
              us: 1e3,
              ms: 1e6,
              s: 1e9,
              m: 60e9,
              h: 3600e9,
            };

            return value * (multipliers[unit] || 1);
          },

          /**
           * Format nanoseconds for display
           */
          formatDuration(nanos) {
            if (nanos === 0 || nanos == null) return "0";

            const absNanos = Math.abs(nanos);

            if (absNanos < 1e3) return `${nanos.toFixed(0)}ns`;
            if (absNanos < 1e6) return `${(nanos / 1e3).toFixed(2)}µs`;
            if (absNanos < 1e9) return `${(nanos / 1e6).toFixed(2)}ms`;
            if (absNanos < 60e9) return `${(nanos / 1e9).toFixed(2)}s`;
            if (absNanos < 3600e9) return `${(nanos / 60e9).toFixed(2)}m`;
            return `${(nanos / 3600e9).toFixed(2)}h`;
          },

          /**
           * Format bytes for display
           */
          formatBytes(bytes) {
            if (bytes === 0 || bytes == null) return "0 B";

            const units = ["B", "KB", "MB", "GB", "TB", "PB"];
            const base = 1024;
            const exp = Math.min(
              Math.floor(Math.log(Math.abs(bytes)) / Math.log(base)),
              units.length - 1,
            );

            return `${(bytes / Math.pow(base, exp)).toFixed(2)} ${units[exp]}`;
          },

          /**
           * Format large numbers with abbreviations
           */
          formatNumber(n) {
            if (n === 0 || n == null) return "0";

            const absN = Math.abs(n);

            if (absN < 1e3) return n.toLocaleString();
            if (absN < 1e6) return `${(n / 1e3).toFixed(1)}K`;
            if (absN < 1e9) return `${(n / 1e6).toFixed(2)}M`;
            if (absN < 1e12) return `${(n / 1e9).toFixed(2)}B`;
            return `${(n / 1e12).toFixed(2)}T`;
          },

          /**
           * Parse a Presto byte string like "25.79GB" to bytes
           */
          parseBytes(str) {
            if (!str || str === "0B") return 0;
            const match = str.match(/^([\d.]+)\s*(B|KB|MB|GB|TB|PB)$/i);
            if (!match) return 0;

            const value = parseFloat(match[1]);
            const unit = match[2].toUpperCase();

            const multipliers = {
              B: 1,
              KB: 1024,
              MB: 1024 ** 2,
              GB: 1024 ** 3,
              TB: 1024 ** 4,
              PB: 1024 ** 5,
            };

            return value * (multipliers[unit] || 1);
          },

          /**
           * Extract stage ID from task ID
           */
          getStageIdFromTaskId(taskId) {
            const parts = taskId.split(".");
            return parts.length >= 2 ? parseInt(parts[1], 10) : 0;
          },

          /**
           * Extract partition ID from task ID
           */
          getPartitionIdFromTaskId(taskId) {
            const parts = taskId.split(".");
            return parts.length >= 4 ? parseInt(parts[3], 10) : 0;
          },

          /**
           * Check if an operator type is GPU-accelerated
           */
          isGpuOperator(operatorType) {
            return operatorType && operatorType.startsWith("Cudf");
          },

          /**
           * Get a friendly name for an operator type
           */
          getOperatorDisplayName(operatorType) {
            // Remove common suffixes for cleaner display
            return operatorType
              .replace("Operator", "")
              .replace("CudfFromVelox", "GPU←CPU")
              .replace("CudfToVelox", "GPU→CPU");
          },

          /**
           * Normalize a plan node ID by removing -to-velox and -from-velox suffixes
           */
          normalizePlanNodeId(planNodeId) {
            if (!planNodeId) return planNodeId;
            return planNodeId
              .replace(/-to-velox$/, "")
              .replace(/-from-velox$/, "");
          },

          /**
           * Simple SQL syntax highlighting
           */
          highlightSQL(sql) {
            const keywords = [
              "SELECT",
              "FROM",
              "WHERE",
              "AND",
              "OR",
              "NOT",
              "IN",
              "EXISTS",
              "JOIN",
              "LEFT",
              "RIGHT",
              "INNER",
              "OUTER",
              "CROSS",
              "ON",
              "GROUP",
              "BY",
              "ORDER",
              "ASC",
              "DESC",
              "HAVING",
              "LIMIT",
              "AS",
              "DISTINCT",
              "ALL",
              "UNION",
              "INTERSECT",
              "EXCEPT",
              "INSERT",
              "INTO",
              "VALUES",
              "UPDATE",
              "SET",
              "DELETE",
              "CREATE",
              "TABLE",
              "VIEW",
              "INDEX",
              "DROP",
              "ALTER",
              "CASE",
              "WHEN",
              "THEN",
              "ELSE",
              "END",
              "BETWEEN",
              "LIKE",
              "IS",
              "NULL",
              "TRUE",
              "FALSE",
              "CAST",
              "WITH",
            ];

            let result = sql;

            // Highlight keywords
            keywords.forEach((kw) => {
              const regex = new RegExp(`\\b(${kw})\\b`, "gi");
              result = result.replace(
                regex,
                '<span class="sql-keyword">$1</span>',
              );
            });

            // Highlight strings
            result = result.replace(
              /'([^']*)'/g,
              "<span class=\"sql-string\">'$1'</span>",
            );

            // Highlight numbers
            result = result.replace(
              /\b(\d+\.?\d*)\b/g,
              '<span class="sql-number">$1</span>',
            );

            return result;
          },

          /**
           * Create a DOM element with attributes and children
           */
          createElement(tag, attrs = {}, children = []) {
            const el = document.createElement(tag);

            Object.entries(attrs).forEach(([key, value]) => {
              if (key === "className") {
                el.className = value;
              } else if (key === "style" && typeof value === "object") {
                Object.assign(el.style, value);
              } else if (key.startsWith("on") && typeof value === "function") {
                el.addEventListener(key.slice(2).toLowerCase(), value);
              } else if (key === "html") {
                el.innerHTML = value;
              } else if (key === "text") {
                el.textContent = value;
              } else {
                el.setAttribute(key, value);
              }
            });

            children.forEach((child) => {
              if (typeof child === "string") {
                el.appendChild(document.createTextNode(child));
              } else if (child instanceof Node) {
                el.appendChild(child);
              }
            });

            return el;
          },

          /**
           * Escape HTML to prevent XSS
           */
          escapeHtml(str) {
            const div = document.createElement("div");
            div.textContent = str;
            return div.innerHTML;
          },

          /**
           * Escape special regex characters in a string
           */
          escapeRegex(str) {
            return str.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          },
        };

        // ==========================================================================
        // Data Model Builder
        // ==========================================================================

        const ModelBuilder = {
          /**
           * Build a normalized data model from raw JSON
           */
          build(rawData) {
            const model = {
              raw: rawData,
              query: this.buildQueryModel(rawData),
              stages: new Map(),
              dagEdges: [],
              planNodes: [], // All plan nodes across stages
              planEdges: [], // Edges between plan nodes (data flow)
              tasks: new Map(),
              operators: [],
              workers: new Map(),
            };

            // Build workers from nodes and worker_metrics
            this.buildWorkers(model, rawData);

            // Build tasks and operators from tasks data
            this.buildTasksAndOperators(model, rawData);

            // Build stage DAG from outputStage
            this.buildStageDag(model, rawData);

            // Build plan graph (operators and data flow)
            this.buildPlanGraph(model, rawData);

            // Aggregate plan node metrics from operators
            this.aggregatePlanNodeMetrics(model);

            // Aggregate stage metrics from tasks
            this.aggregateStageMetrics(model);

            return model;
          },

          buildQueryModel(rawData) {
            const query = rawData.query;
            const stats = query.queryStats || {};

            return {
              id: query.queryId,
              sql: query.query,
              state: query.state,
              session: {
                user: query.session?.user,
                catalog: query.session?.catalog,
                schema: query.session?.schema,
                source: query.session?.source,
              },
              fieldNames: query.fieldNames || [],
              timing: {
                createTime: stats.createTime,
                startTime: stats.executionStartTime,
                endTime: stats.endTime,
                elapsed: stats.elapsedTime,
                queued: stats.queuedTime,
                planning: stats.totalPlanningTime,
                execution: stats.executionTime,
                finishing: stats.finishingTime,
                analysis: stats.analysisTime,
              },
              totals: {
                stages: (stats.stageGcStatistics || []).length,
                tasks: stats.totalTasks || 0,
                drivers: stats.totalDrivers || 0,
                splits: stats.totalSplits || 0,
                cpuTime: stats.totalCpuTime,
                blockedTime: stats.totalBlockedTime,
                rawInputSize: stats.rawInputDataSize,
                rawInputPositions: stats.rawInputPositions,
                processedInputSize: stats.processedInputDataSize,
                processedInputPositions: stats.processedInputPositions,
                shuffledSize: stats.shuffledDataSize,
                shuffledPositions: stats.shuffledPositions,
                outputSize: stats.outputDataSize,
                outputPositions: stats.outputPositions,
                peakUserMemory: stats.peakUserMemoryReservation,
                peakTotalMemory: stats.peakTotalMemoryReservation,
              },
            };
          },

          buildWorkers(model, rawData) {
            // From nodes array
            (rawData.nodes || []).forEach((node) => {
              const workerId = this.uriToWorkerId(node.uri);
              model.workers.set(workerId, {
                id: workerId,
                uri: node.uri,
                host: this.extractHost(node.uri),
                status: {
                  recentRequests: node.recentRequests,
                  recentFailures: node.recentFailures,
                  recentFailureRatio: node.recentFailureRatio,
                  age: node.age,
                },
                metrics: {},
              });
            });

            // Add metrics from worker_metrics
            const workerMetrics = rawData.worker_metrics || {};
            Object.entries(workerMetrics).forEach(([key, metrics]) => {
              const workerId = key;
              if (model.workers.has(workerId)) {
                model.workers.get(workerId).metrics = metrics;
              } else {
                // Worker not in nodes list, add it
                model.workers.set(workerId, {
                  id: workerId,
                  uri: null,
                  host: key.replace(/_/g, ".").replace(/\.(\d+)$/, ":$1"),
                  status: {},
                  metrics: metrics,
                });
              }
            });
          },

          buildTasksAndOperators(model, rawData) {
            const tasks = rawData.tasks || {};

            Object.entries(tasks).forEach(([workerId, taskList]) => {
              taskList.forEach((task) => {
                const taskId = task.taskId;
                const stageId = Utils.getStageIdFromTaskId(taskId);
                const partitionId = Utils.getPartitionIdFromTaskId(taskId);

                const taskModel = {
                  id: taskId,
                  stageId: stageId,
                  partitionId: partitionId,
                  workerId: workerId,
                  workerHost: model.workers.get(workerId)?.host || workerId,
                  stats: task.stats,
                  pipelines: [],
                };

                // Process pipelines and operators
                const pipelines = task.stats?.pipelines || [];
                pipelines.forEach((pipeline) => {
                  const pipelineModel = {
                    id: pipeline.pipelineId,
                    isInput: pipeline.inputPipeline,
                    isOutput: pipeline.outputPipeline,
                    operators: [],
                  };

                  (pipeline.operatorSummaries || []).forEach((op) => {
                    const operatorKey = `${taskId}.${pipeline.pipelineId}.${op.operatorId}`;

                    const operatorModel = {
                      key: operatorKey,
                      taskId: taskId,
                      stageId: stageId,
                      pipelineId: pipeline.pipelineId,
                      operatorId: op.operatorId,
                      planNodeId: op.planNodeId,
                      type: op.operatorType,
                      isGpu: Utils.isGpuOperator(op.operatorType),
                      totalDrivers: op.totalDrivers,
                      metrics: {
                        // Timing (parse string values to nanos)
                        addInputWallNanos: Utils.parseTimeToNanos(
                          op.addInputWall,
                        ),
                        addInputCpuNanos: Utils.parseTimeToNanos(
                          op.addInputCpu,
                        ),
                        getOutputWallNanos: Utils.parseTimeToNanos(
                          op.getOutputWall,
                        ),
                        getOutputCpuNanos: Utils.parseTimeToNanos(
                          op.getOutputCpu,
                        ),
                        blockedWallNanos: Utils.parseTimeToNanos(
                          op.blockedWall,
                        ),
                        finishWallNanos: Utils.parseTimeToNanos(op.finishWall),
                        finishCpuNanos: Utils.parseTimeToNanos(op.finishCpu),
                        // Calls
                        addInputCalls: op.addInputCalls,
                        getOutputCalls: op.getOutputCalls,
                        finishCalls: op.finishCalls,
                        // Data
                        inputBytes: op.inputDataSizeInBytes,
                        inputPositions: op.inputPositions,
                        outputBytes: op.outputDataSizeInBytes,
                        outputPositions: op.outputPositions,
                        rawInputBytes: op.rawInputDataSizeInBytes,
                        rawInputPositions: op.rawInputPositions,
                        // Memory
                        peakUserMemoryBytes:
                          op.peakUserMemoryReservationInBytes,
                        peakTotalMemoryBytes:
                          op.peakTotalMemoryReservationInBytes,
                        spilledBytes: op.spilledDataSizeInBytes,
                      },
                      runtimeStats: op.runtimeStats || {},
                      raw: op,
                    };

                    pipelineModel.operators.push(operatorKey);
                    model.operators.push(operatorModel);
                  });

                  taskModel.pipelines.push(pipelineModel);
                });

                model.tasks.set(taskId, taskModel);
              });
            });
          },

          buildStageDag(model, rawData) {
            const outputStage = rawData.query?.outputStage;
            if (!outputStage) return;

            const processStage = (stage, parentStageId = null) => {
              const stageId = parseInt(stage.stageId.split(".").pop(), 10);
              const plan = stage.plan || {};
              const root = plan.root || {};

              // Find child stage IDs from RemoteSourceNodes
              const childStageIds = this.findRemoteSourceIds(root);

              // Create stage model
              const stageModel = {
                id: stageId,
                planFragmentId: plan.id,
                rootNodeType: this.getNodeTypeName(root["@type"]),
                parentStageIds: parentStageId !== null ? [parentStageId] : [],
                childStageIds: childStageIds,
                tasks: [],
                metrics: {}, // Will be aggregated later
                timing: {
                  firstStartMs: Infinity,
                  lastEndMs: 0,
                  blockedTimeNanos: 0,
                  cpuTimeNanos: 0,
                },
                workerTiming: new Map(), // Per-worker timing data
              };

              model.stages.set(stageId, stageModel);

              // Create DAG edges (child -> this stage)
              childStageIds.forEach((childId) => {
                model.dagEdges.push({
                  source: childId,
                  target: stageId,
                });
              });

              // Process sub-stages
              (stage.subStages || []).forEach((subStage) => {
                processStage(subStage, stageId);
              });
            };

            processStage(outputStage);

            // Associate tasks with stages and aggregate timing
            model.tasks.forEach((task, taskId) => {
              const stage = model.stages.get(task.stageId);
              if (stage) {
                stage.tasks.push(taskId);

                // Update stage timing from task timing
                const stats = task.stats;
                if (
                  stats.firstStartTimeInMillis &&
                  stats.firstStartTimeInMillis < stage.timing.firstStartMs
                ) {
                  stage.timing.firstStartMs = stats.firstStartTimeInMillis;
                }
                if (
                  stats.lastEndTimeInMillis &&
                  stats.lastEndTimeInMillis > stage.timing.lastEndMs
                ) {
                  stage.timing.lastEndMs = stats.lastEndTimeInMillis;
                }

                // Aggregate blocked and CPU time from pipelines
                let taskCpuNanos = 0;
                (task.pipelines || []).forEach((pipeline) => {
                  stage.timing.blockedTimeNanos +=
                    pipeline.totalBlockedTimeInNanos || 0;
                  stage.timing.cpuTimeNanos +=
                    pipeline.totalCpuTimeInNanos || 0;
                  taskCpuNanos += pipeline.totalCpuTimeInNanos || 0;
                });

                // Track per-worker timing
                const workerId = task.workerHost || "unknown";
                if (!stage.workerTiming.has(workerId)) {
                  stage.workerTiming.set(workerId, {
                    firstStartMs: Infinity,
                    lastEndMs: 0,
                    activeStartMs: Infinity, // When work actually started (after blocking)
                    cpuTimeNanos: 0,
                    taskCount: 0,
                  });
                }
                const wt = stage.workerTiming.get(workerId);
                if (stats.firstStartTimeInMillis < wt.firstStartMs) {
                  wt.firstStartMs = stats.firstStartTimeInMillis;
                }
                if (stats.lastEndTimeInMillis > wt.lastEndMs) {
                  wt.lastEndMs = stats.lastEndTimeInMillis;
                }
                wt.cpuTimeNanos += taskCpuNanos;
                wt.taskCount += 1;

                // Calculate when this task became active by finding earliest
                // pipeline active start (pipeline start + blocked time offset)
                (task.pipelines || []).forEach((pipeline) => {
                  const pStart = pipeline.firstStartTimeInMillis || 0;
                  const pEnd = pipeline.lastEndTimeInMillis || 0;
                  const pWallMs = pEnd - pStart;
                  const blockedNs = pipeline.totalBlockedTimeInNanos || 0;
                  const cpuNs = pipeline.totalCpuTimeInNanos || 0;
                  const blockedMs = blockedNs / 1e6;
                  const cpuMs = cpuNs / 1e6;
                  // Cap blocked time at (wall - cpu) to handle parallel drivers
                  const effectiveBlockedMs = Math.max(
                    0,
                    Math.min(blockedMs, pWallMs - cpuMs),
                  );
                  const pActiveStart = pStart + effectiveBlockedMs;
                  // Only consider pipelines with meaningful CPU work
                  if (cpuMs > 0.1 && pActiveStart < wt.activeStartMs) {
                    wt.activeStartMs = pActiveStart;
                  }
                });
              }
            });

            // Calculate query time bounds and normalize stage timing
            const queryStats = rawData.query?.queryStats || {};
            const queryStartMs = queryStats.executionStartTime
              ? new Date(queryStats.executionStartTime).getTime()
              : 0;
            const queryEndMs = queryStats.endTime
              ? new Date(queryStats.endTime).getTime()
              : queryStartMs;

            model.queryTiming = {
              startMs: queryStartMs,
              endMs: queryEndMs,
              durationMs: queryEndMs - queryStartMs,
            };

            // Normalize stage timing to be relative to query start
            model.stages.forEach((stage) => {
              if (stage.timing.firstStartMs === Infinity) {
                stage.timing.firstStartMs = queryStartMs;
              }
              if (stage.timing.lastEndMs === 0) {
                stage.timing.lastEndMs = queryEndMs;
              }
              // Make relative to query start
              stage.timing.relativeStartMs =
                stage.timing.firstStartMs - queryStartMs;
              stage.timing.relativeEndMs =
                stage.timing.lastEndMs - queryStartMs;
              stage.timing.durationMs =
                stage.timing.relativeEndMs - stage.timing.relativeStartMs;

              // Normalize per-worker timing
              stage.workerTiming.forEach((wt, workerId) => {
                if (wt.firstStartMs === Infinity) {
                  wt.firstStartMs = queryStartMs;
                }
                if (wt.lastEndMs === 0) {
                  wt.lastEndMs = queryEndMs;
                }
                if (wt.activeStartMs === Infinity) {
                  // No active work, default to end (fully blocked)
                  wt.activeStartMs = wt.lastEndMs;
                }
                wt.relativeStartMs = wt.firstStartMs - queryStartMs;
                wt.relativeEndMs = wt.lastEndMs - queryStartMs;
                wt.relativeActiveStartMs = wt.activeStartMs - queryStartMs;
                wt.durationMs = wt.relativeEndMs - wt.relativeStartMs;
              });
            });
          },

          findRemoteSourceIds(node, results = []) {
            if (!node || typeof node !== "object") return results;

            const nodeType = node["@type"] || "";
            if (nodeType.includes("RemoteSourceNode")) {
              (node.sourceFragmentIds || []).forEach((id) => {
                results.push(parseInt(id, 10));
              });
            }

            // Recurse through all possible child paths in the plan tree
            const childKeys = [
              "source",
              "left",
              "right",
              "input",
              "sources",
              "filteringSource",
              "probeSource",
              "buildSource",
            ];
            childKeys.forEach((key) => {
              if (node[key]) {
                if (Array.isArray(node[key])) {
                  node[key].forEach((child) =>
                    this.findRemoteSourceIds(child, results),
                  );
                } else if (typeof node[key] === "object") {
                  this.findRemoteSourceIds(node[key], results);
                }
              }
            });

            return results;
          },

          getNodeTypeName(typeStr) {
            if (!typeStr) return "Unknown";
            // Extract last part after dot, remove "Node" suffix
            const parts = typeStr.split(".");
            const name = parts[parts.length - 1];
            return name.replace("Node", "");
          },

          aggregateStageMetrics(model) {
            model.stages.forEach((stage, stageId) => {
              let totalCpuNanos = 0;
              let totalBlockedNanos = 0;
              let totalInputBytes = 0;
              let totalInputRows = 0;
              let totalOutputBytes = 0;
              let totalOutputRows = 0;
              let peakMemory = 0;

              stage.tasks.forEach((taskId) => {
                const task = model.tasks.get(taskId);
                if (!task) return;

                // Get operators for this task
                const taskOperators = model.operators.filter(
                  (op) => op.taskId === taskId,
                );

                taskOperators.forEach((op) => {
                  totalCpuNanos +=
                    op.metrics.getOutputCpuNanos + op.metrics.addInputCpuNanos;
                  totalBlockedNanos += op.metrics.blockedWallNanos;
                  peakMemory = Math.max(
                    peakMemory,
                    op.metrics.peakTotalMemoryBytes,
                  );
                });

                // For input/output, use task-level stats
                const stats = task.stats;
                if (stats) {
                  totalInputBytes += stats.rawInputDataSizeInBytes || 0;
                  totalInputRows += stats.rawInputPositions || 0;
                  totalOutputBytes += stats.outputDataSizeInBytes || 0;
                  totalOutputRows += stats.outputPositions || 0;
                }
              });

              stage.metrics = {
                cpuTimeNanos: totalCpuNanos,
                blockedTimeNanos: totalBlockedNanos,
                inputBytes: totalInputBytes,
                inputRows: totalInputRows,
                outputBytes: totalOutputBytes,
                outputRows: totalOutputRows,
                peakMemoryBytes: peakMemory,
                taskCount: stage.tasks.length,
              };
            });
          },

          buildPlanGraph(model, rawData) {
            const outputStage = rawData.query?.outputStage;
            if (!outputStage) return;

            // Map to track which stage each plan node belongs to
            const nodeStageMap = new Map();

            // Map to track RemoteSourceNode connections (fragmentId -> nodeId)
            const remoteSourceMap = new Map();

            // Process each stage to extract plan nodes
            const processStage = (stage) => {
              const stageId = parseInt(stage.stageId.split(".").pop(), 10);
              const plan = stage.plan || {};
              const root = plan.root;

              if (root) {
                this.extractPlanNodes(
                  root,
                  stageId,
                  model,
                  nodeStageMap,
                  remoteSourceMap,
                  null,
                );
              }

              // Process sub-stages
              (stage.subStages || []).forEach((subStage) =>
                processStage(subStage),
              );
            };

            processStage(outputStage);

            // Now connect RemoteSourceNodes to their source stages' output nodes
            // For each RemoteSourceNode, find the root node of its source stage
            remoteSourceMap.forEach((nodeId, fragmentId) => {
              const sourceStageId = parseInt(fragmentId, 10);
              // Find the root node of the source stage (node with no parent in that stage)
              const sourceRootNode = model.planNodes.find(
                (n) => n.stageId === sourceStageId && n.isStageRoot,
              );
              if (sourceRootNode) {
                model.planEdges.push({
                  source: sourceRootNode.id,
                  target: nodeId,
                  type: "exchange",
                  sourceStageId: sourceStageId,
                  targetStageId: nodeStageMap.get(nodeId),
                });
              }
            });
          },

          extractPlanNodes(
            node,
            stageId,
            model,
            nodeStageMap,
            remoteSourceMap,
            parentId,
          ) {
            if (!node || typeof node !== "object") return;

            const nodeType = node["@type"] || "";
            const nodeId = node.id;

            if (nodeType && nodeId) {
              const typeName = this.getNodeTypeName(nodeType);
              const isRemoteSource = nodeType.includes("RemoteSourceNode");

              const planNode = {
                id: nodeId,
                stageId: stageId,
                type: typeName,
                fullType: nodeType,
                isStageRoot: parentId === null,
                isRemoteSource: isRemoteSource,
                // Capture useful metadata
                joinType: node.type, // For JoinNode: INNER, LEFT, etc.
                aggregationType: node.step, // For AggregationNode: PARTIAL, FINAL
                exchangeType: node.type || node.scope, // For ExchangeNode
                outputVariables: (node.outputVariables || [])
                  .map((v) => (typeof v === "object" ? v.name : v))
                  .filter(Boolean),
                sourceFragmentIds: node.sourceFragmentIds || [],
                // FilterNode: predicate expression
                predicate: node.predicate || null,
                // ProjectNode: assignments (variable -> expression)
                assignments: node.assignments || null,
                // TableScanNode: table info
                table: node.table || null,
                tableHandle: node.tableHandle || null,
                // JoinNode: join criteria and filter
                joinCriteria: node.criteria || null,
                joinFilter: node.filter || null,
                // AggregationNode: aggregations and grouping
                aggregations: node.aggregations || null,
                groupingKeys: node.groupingKeys || null,
                // SortNode / TopNNode: ordering
                orderingScheme: node.orderingScheme || null,
                // LimitNode
                count: node.count || null,
                // WindowNode
                windowFunctions: node.windowFunctions || null,
                // SemiJoinNode
                sourceJoinVariable: node.sourceJoinVariable || null,
                filteringSourceJoinVariable:
                  node.filteringSourceJoinVariable || null,
                // Source location in SQL (line, column, length)
                sourceLocation: node.sourceLocation || null,
                // Raw node for inspection
                rawNode: node,
                // Metrics will be aggregated from operators
                metrics: {
                  inputRows: 0,
                  inputBytes: 0,
                  outputRows: 0,
                  outputBytes: 0,
                  outputBatches: 0,
                },
              };

              model.planNodes.push(planNode);
              nodeStageMap.set(nodeId, stageId);

              // Track RemoteSourceNodes for cross-stage connections
              if (isRemoteSource && node.sourceFragmentIds) {
                node.sourceFragmentIds.forEach((fragId) => {
                  remoteSourceMap.set(fragId, nodeId);
                });
              }

              // Create edge from this node to parent (data flows up the tree)
              if (parentId !== null) {
                model.planEdges.push({
                  source: nodeId,
                  target: parentId,
                  type: "local",
                  stageId: stageId,
                });
              }

              // Recurse into children - they are the sources of data
              const childKeys = [
                "source",
                "left",
                "right",
                "input",
                "sources",
                "filteringSource",
                "probeSource",
                "buildSource",
              ];
              childKeys.forEach((key) => {
                if (node[key]) {
                  if (Array.isArray(node[key])) {
                    node[key].forEach((child) =>
                      this.extractPlanNodes(
                        child,
                        stageId,
                        model,
                        nodeStageMap,
                        remoteSourceMap,
                        nodeId,
                      ),
                    );
                  } else if (typeof node[key] === "object") {
                    this.extractPlanNodes(
                      node[key],
                      stageId,
                      model,
                      nodeStageMap,
                      remoteSourceMap,
                      nodeId,
                    );
                  }
                }
              });
            }
          },

          aggregatePlanNodeMetrics(model) {
            // Build a map of planNodeId -> aggregated metrics from all operators
            // Note: Multiple operators in a pipeline can share the same planNodeId
            // (e.g., CudfAggregation and PartitionedOutput both get planNodeId from their source)
            // We only want to count each planNodeId ONCE per (task, pipeline) to avoid double-counting
            //
            // For exchange nodes (LocalExchange, Exchange, LocalMerge), there are typically two pipelines:
            // - Producer pipeline: outputs data TO the exchange
            // - Consumer pipeline: receives data FROM the exchange
            // We should only count the FIRST pipeline we see for each planNodeId per task to avoid
            // double-counting rows that flow through the exchange.
            const metricsMap = new Map();

            // Track which (task, pipeline, planNodeId) combinations we've already counted
            const counted = new Set();

            // Track which (task, planNodeId) we've seen - only count first pipeline per task
            const seenTaskPlanNode = new Set();

            model.operators.forEach((op) => {
              const rawPlanNodeId = op.planNodeId;
              if (!rawPlanNodeId) return;

              // Normalize plan node ID (remove -to-velox, -from-velox suffixes)
              const planNodeId = Utils.normalizePlanNodeId(rawPlanNodeId);

              // Check if this operator type is an exchange consumer (receives data from exchange)
              // These operators should not contribute to the planNode's output metrics
              // as that would double-count with the producer side
              const isExchangeConsumer =
                op.type.includes("LocalExchange") ||
                op.type.includes("LocalMerge") ||
                op.type.includes("Exchange");

              // For exchange consumers, skip if we've already seen this planNodeId in any pipeline for this task
              // This prevents double-counting when both producer and consumer pipelines report same planNodeId
              if (isExchangeConsumer) {
                const taskPlanKey = `${op.taskId}:${planNodeId}`;
                if (seenTaskPlanNode.has(taskPlanKey)) return;
                seenTaskPlanNode.add(taskPlanKey);
              }

              // Create a unique key for this (task, pipeline, planNodeId) combination
              const countKey = `${op.taskId}:${op.pipelineId}:${planNodeId}`;

              // Skip if we've already counted this planNodeId in this task/pipeline
              if (counted.has(countKey)) return;
              counted.add(countKey);

              if (!metricsMap.has(planNodeId)) {
                metricsMap.set(planNodeId, {
                  inputRows: 0,
                  inputBytes: 0,
                  outputRows: 0,
                  outputBytes: 0,
                  outputBatches: 0,
                });
              }

              const m = metricsMap.get(planNodeId);
              m.inputRows += op.metrics.inputPositions || 0;
              m.inputBytes += op.metrics.inputBytes || 0;
              m.outputRows += op.metrics.outputPositions || 0;
              m.outputBytes += op.metrics.outputBytes || 0;
              m.outputBatches += op.metrics.getOutputCalls || 0;
            });

            // Apply aggregated metrics to plan nodes
            model.planNodes.forEach((node) => {
              const metrics = metricsMap.get(node.id);
              if (metrics) {
                node.metrics = metrics;
              }
            });

            // Also add metrics and column info to edges (output of source node)
            model.planEdges.forEach((edge) => {
              const sourceNode = model.planNodes.find(
                (n) => n.id === edge.source,
              );
              if (sourceNode) {
                // Add metrics
                if (sourceNode.metrics) {
                  edge.rows = sourceNode.metrics.outputRows;
                  edge.bytes = sourceNode.metrics.outputBytes;
                  edge.batches = sourceNode.metrics.outputBatches;
                } else {
                  edge.rows = 0;
                  edge.bytes = 0;
                  edge.batches = 0;
                }
                // Add output columns with types from the raw node
                const rawNode = sourceNode.rawNode;
                if (rawNode && rawNode.outputVariables) {
                  edge.columns = rawNode.outputVariables.map((v) => {
                    if (typeof v === "object") {
                      return { name: v.name, type: v.type || "unknown" };
                    }
                    return { name: v, type: "unknown" };
                  });
                } else {
                  edge.columns = [];
                }
              } else {
                edge.rows = 0;
                edge.bytes = 0;
                edge.batches = 0;
                edge.columns = [];
              }
            });
          },

          uriToWorkerId(uri) {
            // Convert "http://172.18.0.3:8010/v1/status" to "172_18_0_3_8010"
            if (!uri) return "";
            const match = uri.match(/\/\/([^/]+)/);
            if (!match) return uri;
            return match[1].replace(/[.:]/g, "_");
          },

          extractHost(uri) {
            if (!uri) return "";
            const match = uri.match(/\/\/([^/]+)/);
            return match ? match[1] : uri;
          },
        };

          renderTimeline(timing) {
            const phases = [
              { name: "queued", label: "Queued", value: timing.queued },
              { name: "planning", label: "Planning", value: timing.planning },
              {
                name: "execution",
                label: "Execution",
                value: timing.execution,
              },
              {
                name: "finishing",
                label: "Finishing",
                value: timing.finishing,
              },
            ];

            const totalNanos = phases.reduce(
              (sum, p) => sum + Utils.parseTimeToNanos(p.value),
              0,
            );
            if (totalNanos === 0)
              return '<div class="text-muted">No timing data available</div>';

            const segments = phases
              .map((p) => {
                const nanos = Utils.parseTimeToNanos(p.value);
                const pct = (nanos / totalNanos) * 100;
                if (pct < 0.5) return "";
                return `<div class="timeline-segment" data-phase="${p.name}" style="width: ${pct}%;" title="${p.label}: ${p.value}">${pct > 10 ? p.label : ""}</div>`;
              })
              .join("");

            return `<div class="timeline-bar">${segments}</div>`;
          },

          getStateBadgeClass(state) {
            switch (state?.toUpperCase()) {
              case "FINISHED":
                return "success";
              case "RUNNING":
                return "primary";
              case "FAILED":
                return "danger";
              default:
                return "";
            }
          },

          /**
           * Render the Plan view - shows query plan as a graph of operators
           */
          renderPlan(model, container) {
            const nodes = model.planNodes;
            const edges = model.planEdges;

            // Get unique stage IDs for coloring
            const stageIds = [...new Set(nodes.map((n) => n.stageId))].sort(
              (a, b) => a - b,
            );
            const stageColors = {};
            // RAPIDS color palette
            const colorPalette = [
              "#7400ff", // RAPIDS Purple
              "#d216d2", // RAPIDS Magenta
              "#ffb500", // RAPIDS Gold
              "#36c9dd", // RAPIDS Cyan
              "#8735fb", // Light Purple
              "#984dfb", // Medium Purple
              "#a788e4", // Lavender
              "#4ade80", // Green
              "#f87171", // Red
              "#fb923c", // Orange
            ];
            stageIds.forEach((id, i) => {
              stageColors[id] = colorPalette[i % colorPalette.length];
            });

            // Build stage timing data for timeline with per-worker rows
            const queryDuration = model.queryTiming?.durationMs || 1;
            const timelineRows = [];
            stageIds.forEach((id) => {
              const stage = model.stages.get(id);
              const timing = stage.timing || {};
              const workerIds = Array.from(stage.workerTiming.keys()).sort();

              // Add stage header row
              timelineRows.push({
                type: "stage",
                stageId: id,
                startPct: ((timing.relativeStartMs || 0) / queryDuration) * 100,
                endPct:
                  ((timing.relativeEndMs || queryDuration) / queryDuration) *
                  100,
                workerCount: workerIds.length,
              });

              // Add worker rows
              workerIds.forEach((workerId) => {
                const wt = stage.workerTiming.get(workerId);
                const cpuMs = (wt.cpuTimeNanos || 0) / 1e6;
                const wallMs = wt.durationMs || 1;
                const activeStartPct =
                  ((wt.relativeActiveStartMs || 0) / queryDuration) * 100;
                timelineRows.push({
                  type: "worker",
                  stageId: id,
                  workerId,
                  startPct: ((wt.relativeStartMs || 0) / queryDuration) * 100,
                  endPct:
                    ((wt.relativeEndMs || queryDuration) / queryDuration) * 100,
                  activeStartPct, // When work actually started after blocking
                  durationMs: wallMs,
                  cpuMs,
                  taskCount: wt.taskCount,
                });
              });
            });
            const rowHeight = 20;
            const timelineHeight = timelineRows.length * rowHeight + 20;

            container.innerHTML = `
           <div class="view-header">
             <h1 class="view-title">Query Plan</h1>
             <p class="view-subtitle">${nodes.length} operators across ${stageIds.length} stages</p>
           </div>

           <div class="card" style="margin-bottom: 16px;">
             <div class="card-body" style="padding: 16px;">
               <div id="stage-timeline" style="position: relative; height: ${timelineHeight}px; background: var(--bg-secondary); border-radius: 4px; overflow: hidden;">
                 <!-- Time axis -->
                 <div style="position: absolute; top: 0; left: 0; right: 0; height: 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; padding: 0 8px; font-size: 10px; color: var(--text-muted); align-items: center;">
                   <span>0ms</span>
                   <span>${Math.round(queryDuration / 4)}ms</span>
                   <span>${Math.round(queryDuration / 2)}ms</span>
                   <span>${Math.round((queryDuration * 3) / 4)}ms</span>
                   <span>${Math.round(queryDuration)}ms</span>
                 </div>
                 <!-- Stage and worker rows -->
                 ${timelineRows
                   .map((row, idx) =>
                     row.type === "stage"
                       ? `
                   <div class="stage-timeline-row" data-stage-id="${row.stageId}"
                        style="position: absolute; top: ${20 + idx * rowHeight}px; left: 0; right: 0; height: ${rowHeight - 2}px; display: flex; align-items: center; cursor: pointer; transition: background 0.15s ease;"
                        onmouseenter="App.highlightPlanStage(${row.stageId})" onmouseleave="App.unhighlightPlanStage()"
                        title="Stage ${row.stageId}: ${row.workerCount} workers">
                     <span style="width: 70px; padding-left: 8px; font-size: 11px; font-weight: 600; color: ${stageColors[row.stageId]}; flex-shrink: 0;">Stage ${row.stageId}</span>
                     <div style="flex: 1; position: relative; height: ${rowHeight - 8}px; margin-right: 8px;"></div>
                   </div>
                 `
                       : `
                   <div class="stage-timeline-row" data-stage-id="${row.stageId}"
                        style="position: absolute; top: ${20 + idx * rowHeight}px; left: 0; right: 0; height: ${rowHeight - 2}px; display: flex; align-items: center; cursor: pointer; transition: background 0.15s ease;"
                        onmouseenter="App.highlightPlanStage(${row.stageId})" onmouseleave="App.unhighlightPlanStage()"
                        title="Worker: ${row.workerId}, CPU: ${row.cpuMs.toFixed(1)}ms, Wall: ${row.durationMs.toFixed(0)}ms, Tasks: ${row.taskCount}">
                     <span style="width: 70px; padding-left: 16px; font-size: 9px; color: var(--text-muted); flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${row.workerId.split("_").slice(-2, -1)[0] || row.workerId}</span>
                     <div style="flex: 1; position: relative; height: ${rowHeight - 6}px; margin-right: 8px;">
                       <!-- Blocked portion (from start to activeStart, striped) -->
                       <div class="stage-timeline-bar stage-timeline-blocked" style="position: absolute; left: ${row.startPct}%; width: ${Math.max(row.activeStartPct - row.startPct, 0)}%; height: 100%; background: repeating-linear-gradient(45deg, ${stageColors[row.stageId]}40, ${stageColors[row.stageId]}40 3px, ${stageColors[row.stageId]}20 3px, ${stageColors[row.stageId]}20 6px); border-radius: 2px 0 0 2px; transition: opacity 0.15s ease;"></div>
                       <!-- Active portion (from activeStart to end, solid) -->
                       <div class="stage-timeline-bar stage-timeline-active" style="position: absolute; left: ${row.activeStartPct}%; width: ${Math.max(row.endPct - row.activeStartPct, 0)}%; height: 100%; background: ${stageColors[row.stageId]}; border-radius: 0 2px 2px 0; transition: opacity 0.15s ease;"></div>
                     </div>
                   </div>
                 `,
                   )
                   .join("")}
               </div>
             </div>
           </div>

           <div class="card">
             <div class="card-header">
               <span class="card-title">Plan Graph</span>
               <div class="stage-legend" style="display: flex; gap: 12px; flex-wrap: wrap;">
                 ${stageIds
                   .map(
                     (id) => `
                   <span class="badge stage-legend-item" data-stage-id="${id}" style="background: ${stageColors[id]}20; color: ${stageColors[id]}; border: 1px solid ${stageColors[id]}40; cursor: pointer; transition: transform 0.15s ease;"
                         onmouseenter="App.highlightPlanStage(${id})" onmouseleave="App.unhighlightPlanStage()">
                     Stage ${id}
                   </span>
                 `,
                   )
                   .join("")}
               </div>
             </div>
             <div class="card-body no-padding">
               <div id="plan-dag-container" class="dag-container" style="height: 700px; overflow: hidden;"></div>
             </div>
           </div>
         `;

            // Render the DAG
            this.renderPlanDag(model, stageColors);
          },

          /**
           * Render the Explain view - text-based tree representation
           */
          renderExplain(model, container) {
            // Build a map of planNodeId -> operators, normalizing plan node IDs
            const operatorsByNode = new Map();
            model.operators.forEach((op) => {
              const rawNodeId = op.planNodeId;
              if (!rawNodeId) return;
              // Normalize plan node ID (remove -to-velox, -from-velox suffixes)
              const nodeId = Utils.normalizePlanNodeId(rawNodeId);
              if (!operatorsByNode.has(nodeId)) {
                operatorsByNode.set(nodeId, []);
              }
              operatorsByNode.get(nodeId).push(op);
            });

            // Build worker set for each plan node
            const workersByNode = new Map();
            operatorsByNode.forEach((ops, nodeId) => {
              const workers = new Set();
              ops.forEach((op) => {
                const task = model.tasks.get(op.taskId);
                if (task && task.workerHost) {
                  workers.add(task.workerHost);
                }
              });
              workersByNode.set(nodeId, [...workers]);
            });

            // Build pipeline info for each plan node: which pipelines contain this node
            const pipelinesByNode = new Map();
            operatorsByNode.forEach((ops, nodeId) => {
              const pipelineSet = new Set();
              ops.forEach((op) => {
                pipelineSet.add(op.pipelineId);
              });
              pipelinesByNode.set(
                nodeId,
                [...pipelineSet].sort((a, b) => a - b),
              );
            });

            // Build aggregated operator info per plan node, grouped by (pipelineId, operatorId, type)
            // This gives us the runtime operators with their aggregated stats across tasks
            //
            // Start offset calculation: operators within a pipeline execute in sequence,
            // so operator N starts after operators 0..N-1 complete. We calculate cumulative
            // offsets based on the wall times of preceding operators in the same pipeline.
            const operatorInfoByNode = new Map();

            // First pass: gather all operators and compute their durations
            // Key: "stageId:pipelineId:operatorId:type", Value: aggregated operator info
            const allOperators = new Map();
            const workerWallTimesByOp = new Map();

            // Track per-worker active time (computation) and blocked time separately
            const workerActiveTimesByOp = new Map();
            const workerBlockedTimesByOp = new Map();

            // Track per-worker stats for min/max/avg calculation
            const workerStatsByOp = new Map();

            operatorsByNode.forEach((ops, nodeId) => {
              ops.forEach((op) => {
                const key = `${op.stageId}:${op.pipelineId}:${op.operatorId}:${op.type}`;
                if (!allOperators.has(key)) {
                  allOperators.set(key, {
                    nodeId: nodeId,
                    stageId: op.stageId,
                    pipelineId: op.pipelineId,
                    operatorId: op.operatorId,
                    type: op.type,
                    isGpu: op.isGpu,
                    inputRows: 0,
                    inputBytes: 0,
                    outputRows: 0,
                    outputBytes: 0,
                    outputBatches: 0,
                    totalWallNanos: 0,
                    totalActiveNanos: 0,
                    totalBlockedNanos: 0,
                  });
                  workerWallTimesByOp.set(key, new Map());
                  workerActiveTimesByOp.set(key, new Map());
                  workerBlockedTimesByOp.set(key, new Map());
                  workerStatsByOp.set(key, new Map());
                }
                const g = allOperators.get(key);
                g.inputRows += op.metrics.inputPositions || 0;
                g.inputBytes += op.metrics.inputBytes || 0;
                g.outputRows += op.metrics.outputPositions || 0;
                g.outputBytes += op.metrics.outputBytes || 0;
                g.outputBatches += op.metrics.getOutputCalls || 0;

                // Track per-worker stats for min/max/avg
                const task = model.tasks.get(op.taskId);
                const workerId = task?.workerHost || op.taskId;
                const workerStats = workerStatsByOp.get(key);
                if (!workerStats.has(workerId)) {
                  workerStats.set(workerId, {
                    inputRows: 0,
                    inputBytes: 0,
                    outputRows: 0,
                    outputBytes: 0,
                    outputBatches: 0,
                    rawInputBytes: 0,
                    // TableScan specific stats
                    scanTimeNanos: 0,
                    numSplits: 0,
                    scanBatches: 0,
                    getOutputWallNanos: 0,
                    blockedWallNanos: 0,
                  });
                }
                const ws = workerStats.get(workerId);
                ws.inputRows += op.metrics.inputPositions || 0;
                ws.inputBytes += op.metrics.inputBytes || 0;
                ws.outputRows += op.metrics.outputPositions || 0;
                ws.outputBytes += op.metrics.outputBytes || 0;
                ws.outputBatches += op.metrics.getOutputCalls || 0;
                ws.rawInputBytes += op.metrics.rawInputBytes || 0;
                ws.getOutputWallNanos += op.metrics.getOutputWallNanos || 0;
                ws.blockedWallNanos += op.metrics.blockedWallNanos || 0;

                // Extract TableScan-specific runtime stats
                if (op.runtimeStats && op.type.includes("TableScan")) {
                  const planNodeId = Utils.normalizePlanNodeId(op.planNodeId);
                  const prefix = `TableScan.${planNodeId}`;
                  const scanTime = op.runtimeStats[`${prefix}.totalScanTime`];
                  const numSplits = op.runtimeStats[`${prefix}.numSplits`];
                  const outputBatches =
                    op.runtimeStats[`${prefix}.outputBatches`];

                  if (scanTime) ws.scanTimeNanos += scanTime.sum || 0;
                  if (numSplits) ws.numSplits += numSplits.sum || 0;
                  if (outputBatches) ws.scanBatches += outputBatches.sum || 0;
                }

                // Calculate active time (actual computation) and blocked time separately
                const activeNanos =
                  (op.metrics.addInputWallNanos || 0) +
                  (op.metrics.getOutputWallNanos || 0) +
                  (op.metrics.finishWallNanos || 0);
                const blockedNanos = op.metrics.blockedWallNanos || 0;
                const totalNanos = activeNanos + blockedNanos;

                g.totalWallNanos += totalNanos;
                g.totalActiveNanos += activeNanos;
                g.totalBlockedNanos += blockedNanos;

                // Track per-worker times (reuse workerId from above)
                const workerTimes = workerWallTimesByOp.get(key);
                workerTimes.set(
                  workerId,
                  (workerTimes.get(workerId) || 0) + totalNanos,
                );

                const workerActive = workerActiveTimesByOp.get(key);
                workerActive.set(
                  workerId,
                  (workerActive.get(workerId) || 0) + activeNanos,
                );

                const workerBlocked = workerBlockedTimesByOp.get(key);
                workerBlocked.set(
                  workerId,
                  (workerBlocked.get(workerId) || 0) + blockedNanos,
                );
              });
            });

            // Calculate max worker times for each operator
            // Use active time (not blocked) for timeline duration
            // Track min/max/avg blocked time across workers
            // Track min/max/avg/sum for rows, bytes, batches across workers
            allOperators.forEach((g, key) => {
              const workerTimes = workerWallTimesByOp.get(key);
              const workerActive = workerActiveTimesByOp.get(key);
              const workerBlocked = workerBlockedTimesByOp.get(key);
              const workerStats = workerStatsByOp.get(key);

              g.maxWorkerWallNanos = Math.max(...workerTimes.values(), 0);
              g.maxWorkerActiveNanos = Math.max(...workerActive.values(), 0);

              // Calculate min/max/avg blocked time across workers
              const blockedValues = [...workerBlocked.values()];
              g.minWorkerBlockedNanos =
                blockedValues.length > 0 ? Math.min(...blockedValues) : 0;
              g.maxWorkerBlockedNanos =
                blockedValues.length > 0 ? Math.max(...blockedValues) : 0;
              g.avgWorkerBlockedNanos =
                blockedValues.length > 0
                  ? blockedValues.reduce((a, b) => a + b, 0) /
                    blockedValues.length
                  : 0;
              g.workerCount = blockedValues.length;

              // Calculate min/max/avg/sum for rows, bytes, batches across workers
              const statsValues = [...workerStats.values()];
              if (statsValues.length > 0) {
                const inputRowValues = statsValues.map((s) => s.inputRows);
                const inputByteValues = statsValues.map((s) => s.inputBytes);
                const rowValues = statsValues.map((s) => s.outputRows);
                const byteValues = statsValues.map((s) => s.outputBytes);
                const batchValues = statsValues.map((s) => s.outputBatches);

                g.inputRowsSum = inputRowValues.reduce((a, b) => a + b, 0);
                g.inputBytesSum = inputByteValues.reduce((a, b) => a + b, 0);
                g.rowsMin = Math.min(...rowValues);
                g.rowsMax = Math.max(...rowValues);
                g.rowsAvg =
                  rowValues.reduce((a, b) => a + b, 0) / rowValues.length;
                g.rowsSum = g.outputRows; // Already summed

                g.bytesMin = Math.min(...byteValues);
                g.bytesMax = Math.max(...byteValues);
                g.bytesAvg =
                  byteValues.reduce((a, b) => a + b, 0) / byteValues.length;
                g.bytesSum = g.outputBytes; // Already summed

                g.batchesMin = Math.min(...batchValues);
                g.batchesMax = Math.max(...batchValues);
                g.batchesAvg =
                  batchValues.reduce((a, b) => a + b, 0) / batchValues.length;
                g.batchesSum = g.outputBatches; // Already summed

                // TableScan-specific aggregations
                const scanTimeValues = statsValues.map((s) => s.scanTimeNanos);
                const splitsValues = statsValues.map((s) => s.numSplits);
                const scanBatchValues = statsValues.map((s) => s.scanBatches);
                const rawInputValues = statsValues.map((s) => s.rawInputBytes);
                const getOutputWallValues = statsValues.map(
                  (s) => s.getOutputWallNanos,
                );
                const blockedWallValues = statsValues.map(
                  (s) => s.blockedWallNanos,
                );

                g.scanTimeSum = scanTimeValues.reduce((a, b) => a + b, 0);
                g.splitsSum = splitsValues.reduce((a, b) => a + b, 0);
                g.scanBatchesSum = scanBatchValues.reduce((a, b) => a + b, 0);
                g.rawInputBytesSum = rawInputValues.reduce((a, b) => a + b, 0);
                g.getOutputWallMax = Math.max(...getOutputWallValues);
                g.blockedWallMin = Math.min(...blockedWallValues);

                // Store per-worker details for hover tooltip
                g.workerDetails = statsValues.map((s, i) => {
                  const workerIds = [...workerStats.keys()];
                  return {
                    workerId: workerIds[i],
                    inputRows: s.inputRows,
                    outputRows: s.outputRows,
                    inputBytes: s.inputBytes,
                    outputBytes: s.outputBytes,
                    rawInputBytes: s.rawInputBytes,
                    scanTimeNanos: s.scanTimeNanos,
                    numSplits: s.numSplits,
                    scanBatches: s.scanBatches,
                    getOutputWallNanos: s.getOutputWallNanos,
                    blockedWallNanos: s.blockedWallNanos,
                  };
                });
              } else {
                g.inputRowsSum = 0;
                g.inputBytesSum = 0;
                g.rowsMin = g.rowsMax = g.rowsAvg = g.rowsSum = 0;
                g.bytesMin = g.bytesMax = g.bytesAvg = g.bytesSum = 0;
                g.batchesMin = g.batchesMax = g.batchesAvg = g.batchesSum = 0;
                g.scanTimeSum = g.splitsSum = g.scanBatchesSum = 0;
                g.rawInputBytesSum = g.getOutputWallMax = g.blockedWallMin = 0;
                g.workerDetails = [];
              }

              // Use active time for timeline duration (excludes blocked/waiting time)
              g.durationMs = g.maxWorkerActiveNanos / 1e6;
              g.blockedMinMs = g.minWorkerBlockedNanos / 1e6;
              g.blockedMaxMs = g.maxWorkerBlockedNanos / 1e6;
              g.blockedAvgMs = g.avgWorkerBlockedNanos / 1e6;
            });

            // Second pass: group operators by (stageId, pipelineId) and calculate cumulative offsets
            // Within a pipeline, operators execute in sequence: op0 -> op1 -> op2 -> ...
            const operatorsByPipeline = new Map();
            allOperators.forEach((op, key) => {
              const pipelineKey = `${op.stageId}:${op.pipelineId}`;
              if (!operatorsByPipeline.has(pipelineKey)) {
                operatorsByPipeline.set(pipelineKey, []);
              }
              operatorsByPipeline.get(pipelineKey).push(op);
            });

            // Use actual wall clock timing from stages for positioning
            // Find the earliest stage start time as our baseline (time 0)
            let queryStartMs = Infinity;
            model.stages.forEach((stage) => {
              if (
                stage.timing.firstStartMs &&
                stage.timing.firstStartMs < queryStartMs
              ) {
                queryStartMs = stage.timing.firstStartMs;
              }
            });
            if (queryStartMs === Infinity) queryStartMs = 0;

            // Calculate stage start/end offsets relative to query start
            const stageStartOffsets = new Map();
            const stageEndOffsets = new Map();
            model.stages.forEach((stage, stageId) => {
              const startMs = stage.timing.firstStartMs
                ? stage.timing.firstStartMs - queryStartMs
                : 0;
              const endMs = stage.timing.lastEndMs
                ? stage.timing.lastEndMs - queryStartMs
                : startMs;
              stageStartOffsets.set(stageId, startMs);
              stageEndOffsets.set(stageId, endMs);
            });

            // Sort operators within each pipeline by operatorId
            operatorsByPipeline.forEach((ops, pipelineKey) => {
              ops.sort((a, b) => a.operatorId - b.operatorId);
            });

            // Position operators within their stage's time window
            // Operators in a pipeline stream data, so we position them proportionally
            // based on their order in the pipeline within the stage's actual duration
            allOperators.forEach((op) => {
              const stageStart = stageStartOffsets.get(op.stageId) || 0;
              const stageEnd = stageEndOffsets.get(op.stageId) || stageStart;
              const stageDuration = stageEnd - stageStart;

              // Get the pipeline's operators to find this operator's position
              const pipelineKey = `${op.stageId}:${op.pipelineId}`;
              const pipelineOps = operatorsByPipeline.get(pipelineKey) || [];
              const opIndex = pipelineOps.findIndex(
                (o) => o.operatorId === op.operatorId && o.type === op.type,
              );
              const numOps = pipelineOps.length;

              if (numOps > 1 && stageDuration > 0) {
                // Position proportionally within the stage duration
                const fraction = opIndex / (numOps - 1);
                // Operator starts at its proportional position, duration scaled to fit
                const opDurationFraction = 1 / numOps;
                op.startOffsetMs =
                  stageStart +
                  fraction * stageDuration * (1 - opDurationFraction);
                op.durationMs = stageDuration * opDurationFraction;
              } else {
                // Single operator or no duration - use full stage window
                op.startOffsetMs = stageStart;
                op.durationMs = stageDuration || op.durationMs;
              }
            });

            // Third pass: group back by plan node for rendering
            operatorsByNode.forEach((ops, nodeId) => {
              const nodeOps = [];
              const seenKeys = new Set();

              ops.forEach((op) => {
                const key = `${op.stageId}:${op.pipelineId}:${op.operatorId}:${op.type}`;
                if (!seenKeys.has(key) && allOperators.has(key)) {
                  seenKeys.add(key);
                  nodeOps.push(allOperators.get(key));
                }
              });

              // Sort by pipeline, then operator id
              nodeOps.sort((a, b) => {
                if (a.pipelineId !== b.pipelineId)
                  return a.pipelineId - b.pipelineId;
                return a.operatorId - b.operatorId;
              });
              operatorInfoByNode.set(nodeId, nodeOps);
            });

            // Calculate operator duration per plan node
            //
            // Per-operator wall time is derived from summing four components:
            //   addInputWall + getOutputWall + finishWall + blockedWall
            // (See https://github.com/prestodb/presto/blob/6fb40f02af65d48a808697efa7bb1e404418ccec/presto-ui/src/components/StageDetail.jsx#L44-L48)
            //
            // For timeline visualization with parallel workers:
            // - We use maxWorkerActiveNanos (max active time of any single worker) as the duration
            // - Active time = addInputWall + getOutputWall + finishWall (excludes blockedWall)
            // - Blocked time is tracked separately for display
            const timingByNode = new Map();
            operatorsByNode.forEach((ops, nodeId) => {
              let totalActiveNanos = 0;
              let totalBlockedNanos = 0;

              // Track per-worker times to find the max (for parallel execution)
              const workerActiveTimes = new Map();
              const workerBlockedTimes = new Map();

              // For each operator instance of this plan node
              ops.forEach((op) => {
                // Calculate active time (actual computation) and blocked time separately
                const activeNanos =
                  (op.metrics.addInputWallNanos || 0) +
                  (op.metrics.getOutputWallNanos || 0) +
                  (op.metrics.finishWallNanos || 0);
                const blockedNanos = op.metrics.blockedWallNanos || 0;

                totalActiveNanos += activeNanos;
                totalBlockedNanos += blockedNanos;

                // Track per-worker totals (workers execute in parallel)
                const task = model.tasks.get(op.taskId);
                const workerId = task?.workerHost || op.taskId;
                workerActiveTimes.set(
                  workerId,
                  (workerActiveTimes.get(workerId) || 0) + activeNanos,
                );
                workerBlockedTimes.set(
                  workerId,
                  (workerBlockedTimes.get(workerId) || 0) + blockedNanos,
                );
              });

              // Max times across workers - this is the duration for the slowest worker
              const maxWorkerActiveNanos = Math.max(
                ...workerActiveTimes.values(),
                0,
              );
              const maxWorkerBlockedNanos = Math.max(
                ...workerBlockedTimes.values(),
                0,
              );

              timingByNode.set(nodeId, {
                activeMs: maxWorkerActiveNanos / 1e6, // Active computation time
                blockedMs: maxWorkerBlockedNanos / 1e6, // Blocked/waiting time
                durationMs: maxWorkerActiveNanos / 1e6, // For backward compat
                totalActiveNanos: totalActiveNanos,
                totalBlockedNanos: totalBlockedNanos,
              });
            });

            // Get stage colors
            const stageIds = [...model.stages.keys()].sort((a, b) => a - b);
            const stageColorPalette = [
              "#4a9eff",
              "#22c55e",
              "#f59e0b",
              "#ef4444",
              "#8b5cf6",
              "#ec4899",
              "#14b8a6",
              "#f97316",
              "#06b6d4",
              "#84cc16",
            ];
            const stageColors = {};
            stageIds.forEach((id, i) => {
              stageColors[id] = stageColorPalette[i % stageColorPalette.length];
            });

            // Build the tree structure from raw query data
            const outputStage = model.raw.query?.outputStage;
            if (!outputStage) {
              container.innerHTML = `<div class="view-header">
                   <h1 class="view-title">Explain</h1>
                   <p class="view-subtitle">No query plan available</p>
                 </div>`;
              return;
            }

            // Recursive function to render a stage and its plan tree
            const renderStageTree = (stage, depth = 0) => {
              const stageId = parseInt(stage.stageId.split(".").pop(), 10);
              const plan = stage.plan || {};
              const root = plan.root || {};
              const color = stageColors[stageId] || "#4a9eff";

              // Get stage metrics from model
              const stageData = model.stages.get(stageId);
              const stageMetrics = stageData?.metrics || {};

              // Get tasks for this stage
              const stageTasks = [...model.tasks.values()].filter(
                (t) => t.stageId === stageId,
              );

              // Get unique workers for this stage
              const stageWorkers = new Set();
              stageTasks.forEach((t) => {
                if (t.workerHost) stageWorkers.add(t.workerHost);
              });
              const stageWorkerCount = stageWorkers.size;
              const stageWorkerList = [...stageWorkers].sort();

              // Render the plan node tree within this stage
              const renderPlanNode = (node, indent = 0) => {
                if (!node || typeof node !== "object") return "";

                const nodeType = node["@type"] || "";
                const nodeId = node.id;
                if (!nodeType || !nodeId) return "";

                const typeName = nodeType.split(".").pop().replace("Node", "");
                const operatorInfos = operatorInfoByNode.get(nodeId) || [];
                // Keep timing computation (active/blocked) but don't render for now
                const timing = timingByNode.get(nodeId) || {
                  activeMs: 0,
                  blockedMs: 0,
                  durationMs: 0,
                };

                // Check if this is a RemoteSource (exchange boundary)
                const isRemoteSource = nodeType.includes("RemoteSourceNode");
                const sourceFragmentIds = node.sourceFragmentIds || [];

                // Check if this is a TableScan node
                const isTableScan = nodeType.includes("TableScanNode");

                // Check if this is a Filter node (needed for opInfoHtml)
                const isFilter = nodeType.includes("FilterNode");

                // Check if this is a Project node (needed for opInfoHtml)
                const isProject = nodeType.includes("ProjectNode");

                // Format runtime operators - pipeline label and operator name with GPU badge
                // For filters and projects, include per-worker details under each operator
                const opInfoHtml = operatorInfos
                  .map((op, opIdx) => {
                    const opName = Utils.getOperatorDisplayName(op.type);
                    const gpuBadge = op.isGpu
                      ? '<span class="badge gpu" style="font-size: 8px; padding: 0 3px; margin-left: 4px;">GPU</span>'
                      : "";

                    // Check if this is an exchange operator
                    const isExchangeOp =
                      op.type.includes("PartitionedOutput") ||
                      op.type.includes("Exchange") ||
                      op.type.includes("LocalExchange") ||
                      op.type.includes("ExchangeClient") ||
                      op.type.includes("LocalMerge");
                    const exchangeBadge = isExchangeOp
                      ? '<span class="badge exchange" style="font-size: 8px; padding: 0 3px; margin-left: 4px; background: linear-gradient(135deg, #d216d2 0%, #8b5cf6 100%); color: white; border-radius: 3px;">EXCHANGE</span>'
                      : "";

                    // For filters and projects, build per-worker details table for this operator
                    let workerDetailsHtml = "";
                    const hasWorkerDetails =
                      (isFilter || isProject) && op.workerDetails?.length > 0;
                    if (hasWorkerDetails) {
                      const workerRows = op.workerDetails
                        .map(
                          (w) => `<tr>
                             <td>${Utils.escapeHtml(w.workerId)}</td>
                             <td style="text-align: right;">${Utils.formatNumber(w.inputRows)}</td>
                             <td style="text-align: right;">${Utils.formatNumber(w.outputRows)}</td>
                             <td style="text-align: right;">${Utils.formatBytes(w.inputBytes)}</td>
                             <td style="text-align: right;">${Utils.formatBytes(w.outputBytes)}</td>
                             <td style="text-align: right;">${Utils.formatDuration(w.blockedWallNanos)}</td>
                             <td style="text-align: right;">${Utils.formatDuration(w.getOutputWallNanos)}</td>
                           </tr>`,
                        )
                        .join("");

                      workerDetailsHtml = `
                           <div class="filter-op-details">
                             <table style="width: 100%; border-collapse: collapse; font-size: 10px;">
                               <thead>
                                 <tr style="border-bottom: 1px solid var(--border-secondary);">
                                   <th style="text-align: left; padding: 2px 4px;">Worker</th>
                                   <th style="text-align: right; padding: 2px 4px;">In Rows</th>
                                   <th style="text-align: right; padding: 2px 4px;">Out Rows</th>
                                   <th style="text-align: right; padding: 2px 4px;">In Bytes</th>
                                   <th style="text-align: right; padding: 2px 4px;">Out Bytes</th>
                                   <th style="text-align: right; padding: 2px 4px;">Blocked</th>
                                   <th style="text-align: right; padding: 2px 4px;">Wall</th>
                                 </tr>
                               </thead>
                               <tbody>
                                 ${workerRows}
                               </tbody>
                             </table>
                           </div>
                         `;
                    }

                    return `<div style="color: var(--text-muted); font-size: 11px;">
                         <span class="explain-pipeline-badge">P${op.pipelineId}.${op.operatorId}</span>
                         <span style="margin-left: 4px;">${Utils.escapeHtml(opName)}</span>${gpuBadge}${exchangeBadge}
                         ${workerDetailsHtml}
                       </div>`;
                  })
                  .join("");

                // Build TableScan-specific stats HTML
                let tableScanStatsHtml = "";
                let tableScanLabelsHtml = "";
                if (isTableScan && operatorInfos.length > 0) {
                  // Aggregate stats from all operators for this node
                  const scanOp = operatorInfos[0]; // TableScan typically has one operator

                  if (scanOp.scanTimeSum > 0 || scanOp.splitsSum > 0) {
                    // Build per-worker details table rows
                    const workerDetails = scanOp.workerDetails || [];
                    const workerTableRows = workerDetails
                      .map((w) => {
                        const throughput =
