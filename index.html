          /**
           * Render the DAG visualization using D3
           */
          renderDag(model, container) {
            if (!container || typeof d3 === "undefined") {
              container.innerHTML =
                '<div class="loading">D3.js required for DAG visualization</div>';
              return;
            }

            const stages = Array.from(model.stages.values());
            const edges = model.dagEdges;

            // Clear container
            container.innerHTML = "";

            const width = container.clientWidth;
            const height = container.clientHeight || 500;

            // Create SVG
            const svg = d3
              .select(container)
              .append("svg")
              .attr("width", width)
              .attr("height", height);

            // Add arrow marker definition
            svg
              .append("defs")
              .append("marker")
              .attr("id", "arrowhead")
              .attr("viewBox", "-0 -5 10 10")
              .attr("refX", 20)
              .attr("refY", 0)
              .attr("orient", "auto")
              .attr("markerWidth", 8)
              .attr("markerHeight", 8)
              .append("path")
              .attr("d", "M 0,-5 L 10,0 L 0,5")
              .attr("class", "dag-edge-arrow");

            // Calculate node positions using a simple layered approach
            const nodePositions = this.calculateDagLayout(
              stages,
              edges,
              width,
              height,
            );

            // Create a group for zoom/pan
            const g = svg.append("g");

            // Zoom/pan with trackpad-friendly behavior:
            // - Mouse drag or two-finger trackpad scroll = pan
            // - Trackpad pinch (ctrlKey) or Ctrl+wheel = zoom
            const zoom = d3
              .zoom()
              .scaleExtent([0.3, 3])
              .on("zoom", (event) => {
                g.attr("transform", event.transform);
              });

            svg.call(zoom).on("wheel.zoom", (event) => {
              event.preventDefault();
              const currentZoom = d3.zoomTransform(svg.node()).k;
              if (event.ctrlKey) {
                // Pinch or Ctrl+wheel = zoom under cursor
                const nextZoom =
                  currentZoom * Math.pow(2, -event.deltaY * 0.01);
                zoom.scaleTo(svg, nextZoom, d3.pointer(event));
              } else {
                // Two-finger trackpad scroll or mouse wheel = pan
                zoom.translateBy(
                  svg,
                  -event.deltaX / currentZoom,
                  -event.deltaY / currentZoom,
                );
              }
            });

            // Draw edges
            const edgeSelection = g
              .selectAll(".dag-edge")
              .data(edges)
              .enter()
              .append("path")
              .attr("class", "dag-edge")
              .attr("marker-end", "url(#arrowhead)")
              .attr("d", (d) => {
                const source = nodePositions.get(d.source);
                const target = nodePositions.get(d.target);
                if (!source || !target) return "";

                // Simple straight line
                return `M ${source.x} ${source.y} L ${target.x} ${target.y}`;
              });

            // Draw nodes
            const nodeWidth = 120;
            const nodeHeight = 50;

            const nodeGroups = g
              .selectAll(".dag-node")
              .data(stages)
              .enter()
              .append("g")
              .attr("class", "dag-node")
              .attr("transform", (d) => {
                const pos = nodePositions.get(d.id);
                return `translate(${pos.x - nodeWidth / 2}, ${pos.y - nodeHeight / 2})`;
              })
              .on("click", (event, d) => {
                App.showStageDetail(d.id);
              });

            nodeGroups
              .append("rect")
              .attr("width", nodeWidth)
              .attr("height", nodeHeight);

            nodeGroups
              .append("text")
              .attr("x", nodeWidth / 2)
              .attr("y", 20)
              .attr("text-anchor", "middle")
              .text((d) => `Stage ${d.id}`);

            nodeGroups
              .append("text")
              .attr("class", "node-type")
              .attr("x", nodeWidth / 2)
              .attr("y", 38)
              .attr("text-anchor", "middle")
              .text((d) => d.rootNodeType);

            // Fit the view
            const bounds = g.node().getBBox();
            const fullWidth = bounds.width;
            const fullHeight = bounds.height;
            const midX = bounds.x + fullWidth / 2;
            const midY = bounds.y + fullHeight / 2;

            const scale = Math.min(
              (0.9 * width) / fullWidth,
              (0.9 * height) / fullHeight,
              1,
            );
            const translate = [
              width / 2 - scale * midX,
              height / 2 - scale * midY,
            ];

            svg.call(
              zoom.transform,
              d3.zoomIdentity
                .translate(translate[0], translate[1])
                .scale(scale),
            );
          },

          calculateDagLayout(stages, edges, width, height) {
            const positions = new Map();

            // Build adjacency lists
            const children = new Map();
            const parents = new Map();

            stages.forEach((s) => {
              children.set(s.id, []);
              parents.set(s.id, []);
            });

            edges.forEach((e) => {
              children.get(e.source)?.push(e.target);
              parents.get(e.target)?.push(e.source);
            });

            // Find root nodes (no children = output stages, but in our DAG, stage 0 is the root)
            // Actually, in this data, edges go from source to target (producer to consumer)
            // So stage 0 has no children (nothing consumes its output)
            const roots = stages.filter((s) => children.get(s.id).length === 0);

            // Assign layers using BFS from roots going backwards
            const layers = new Map();
            const visited = new Set();

            let currentLayer = 0;
            let currentNodes = roots.map((s) => s.id);

            while (currentNodes.length > 0) {
              currentNodes.forEach((id) => {
                if (!visited.has(id)) {
                  layers.set(id, currentLayer);
                  visited.add(id);
                }
              });

              const nextNodes = [];
              currentNodes.forEach((id) => {
                (parents.get(id) || []).forEach((parentId) => {
                  if (!visited.has(parentId)) {
                    nextNodes.push(parentId);
                  }
                });
              });

              currentNodes = nextNodes;
              currentLayer++;
            }

            // Handle any unvisited nodes (disconnected)
            stages.forEach((s) => {
              if (!layers.has(s.id)) {
                layers.set(s.id, currentLayer);
              }
            });

            // Group by layer
            const layerGroups = new Map();
            layers.forEach((layer, id) => {
              if (!layerGroups.has(layer)) {
                layerGroups.set(layer, []);
              }
              layerGroups.get(layer).push(id);
            });

            // Calculate positions
            const maxLayer = Math.max(...layers.values());
            const layerHeight = height / (maxLayer + 2);
            const margin = 60;

            layerGroups.forEach((ids, layer) => {
              const layerWidth = (width - 2 * margin) / (ids.length + 1);
              ids.forEach((id, i) => {
                positions.set(id, {
                  x: margin + layerWidth * (i + 1),
                  y: margin + layerHeight * (layer + 0.5),
                });
              });
            });

            return positions;
          },

          // Helper to format an expression for display
          formatExpression(expr) {
            if (!expr) return null;
            if (typeof expr === "string") return Utils.escapeHtml(expr);
            // Handle Presto expression objects
            if (expr["@type"]) {
              const type = expr["@type"].split(".").pop();
              // CallExpression: function call
              if (type === "CallExpression" || type === "call") {
                const funcName = expr.displayName || expr.functionName || "?";
                const args = (expr.arguments || [])
                  .map((a) => this.formatExpression(a))
                  .join(", ");
                return `${funcName}(${args})`;
              }
              // VariableReferenceExpression
              if (
                type === "VariableReferenceExpression" ||
                type === "variable"
              ) {
                return expr.name || "?";
              }
              // ConstantExpression
              if (type === "ConstantExpression" || type === "constant") {
                return expr.value !== undefined
                  ? String(expr.value)
                  : expr.valueBlock || "?";
              }
              // SpecialFormExpression (AND, OR, etc.)
              if (type === "SpecialFormExpression" || type === "special") {
                const form = expr.form || expr.functionName || "?";
                const args = (expr.arguments || [])
                  .map((a) => this.formatExpression(a))
                  .join(` ${form} `);
                return `(${args})`;
              }
              // ComparisonExpression
              if (type === "ComparisonExpression" || type === "comparison") {
                const op = expr.operator || "=";
                const left = this.formatExpression(expr.left);
                const right = this.formatExpression(expr.right);
                return `${left} ${op} ${right}`;
              }
              // InputReferenceExpression
              if (type === "InputReferenceExpression") {
                return `$input[${expr.field || 0}]`;
              }
              // Fallback: show type
              return `[${type}]`;
            }
            // Fallback for unknown structure
            return JSON.stringify(expr).slice(0, 100);
          },

          // Helper to get table name from table handle
          getTableName(node) {
            const table = node.table || node.tableHandle;
            if (!table) return null;
            // Try different structures
            if (table.tableName) return table.tableName;
            if (table.connectorHandle) {
              const ch = table.connectorHandle;
              if (ch.tableName) return ch.tableName;
              if (ch.schemaTableName) {
                const st = ch.schemaTableName;
                return (
                  st.tableName || `${st.schemaName || ""}.${st.tableName || ""}`
                );
              }
            }
            if (table.schemaTableName) {
              const st = table.schemaTableName;
              return `${st.schemaName || ""}.${st.tableName || ""}`;
            }
            return null;
          },

                         let aggStr = "";
                         if (agg.call) {
                           const funcName =
                             agg.call.displayName ||

                           const args = (agg.call.arguments || [])
                             .map((a) => this.formatExpression(a))

                           aggStr = `${funcName}(${args})`;

                         return `
                       <div style="margin-bottom: 6px; padding: 6px; background: var(--bg-secondary); border-radius: 4px;">
                         <div style="font-family: var(--font-mono); font-size: 11px; color: var(--accent-primary);">${Utils.escapeHtml(varName)}</div>
                         <div style="font-family: var(--font-mono); font-size: 10px; color: var(--text-secondary); margin-top: 2px;">${aggStr}</div>
                       </div>`;
                       })
                       .join("")}
                   </div>
                 </div>`;
            }
            if (node.groupingKeys && node.groupingKeys.length > 0) {
              const keys = node.groupingKeys
                .map((k) => (typeof k === "object" ? k.name : k))
                .filter(Boolean);
              if (keys.length > 0) {
                nodeSpecificHtml += `
                   <div class="detail-section">
                     <div class="detail-section-title">Grouping Keys</div>
                     <div class="sql-display" style="font-size: 11px;">${keys.map((k) => Utils.escapeHtml(k)).join(", ")}</div>
                   </div>`;
              }
            }

            // Sort/TopN: show ordering
            if (node.orderingScheme) {
              const orderBy = node.orderingScheme.orderBy || [];
              const orderings = node.orderingScheme.orderings || {};
              if (orderBy.length > 0) {
                nodeSpecificHtml += `
                   <div class="detail-section">
                     <div class="detail-section-title">Order By</div>
                     <div class="sql-display" style="font-size: 11px;">
                       ${orderBy
                         .map((col) => {
                           const colName =
                             typeof col === "object" ? col.name : col;
                           const order = orderings[colName] || "ASC";
                           return `${Utils.escapeHtml(colName)} ${order}`;
                         })
                         .join(", ")}
                     </div>
                   </div>`;
              }
            }

            // Limit: show count
            if (node.count !== null && node.count !== undefined) {
              nodeSpecificHtml += `
                 <div class="detail-section">
                   <div class="detail-section-title">Limit</div>
                   <div class="detail-row">
                     <span class="detail-label">Count</span>
                     <span class="detail-value">${node.count}</span>
                   </div>
                 </div>`;
            }

            // Window: show window functions
            if (
              node.windowFunctions &&
              Object.keys(node.windowFunctions).length > 0
            ) {
              const funcs = Object.entries(node.windowFunctions);
              nodeSpecificHtml += `
                 <div class="detail-section">
                   <div class="detail-section-title">Window Functions (${funcs.length})</div>
                   <div style="max-height: 200px; overflow-y: auto;">
                     ${funcs
                       .map(([varName, wf]) => {
                         let funcStr = "";
                         if (wf.functionCall) {
                           const funcName =
                             wf.functionCall.displayName ||
                             wf.functionCall.functionName ||
                             "?";
                           const args = (wf.functionCall.arguments || [])
                             .map((a) => this.formatExpression(a))
                             .join(", ");
                           funcStr = `${funcName}(${args})`;
                         }
                         return `
                       <div style="margin-bottom: 6px; padding: 6px; background: var(--bg-secondary); border-radius: 4px;">
                         <div style="font-family: var(--font-mono); font-size: 11px; color: var(--accent-primary);">${Utils.escapeHtml(varName)}</div>
                         <div style="font-family: var(--font-mono); font-size: 10px; color: var(--text-secondary); margin-top: 2px;">${funcStr}</div>
                       </div>`;
                       })
                       .join("")}
                   </div>
                 </div>`;
            }

            // SemiJoin: show join variables
            if (node.sourceJoinVariable || node.filteringSourceJoinVariable) {
              nodeSpecificHtml += `
                 <div class="detail-section">
                   <div class="detail-section-title">Semi Join Variables</div>
                   ${
                     node.sourceJoinVariable
                       ? `
                   <div class="detail-row">
                     <span class="detail-label">Source</span>
                     <span class="detail-value font-mono">${typeof node.sourceJoinVariable === "object" ? node.sourceJoinVariable.name : node.sourceJoinVariable}</span>
                   </div>`
                       : ""
                   }
                   ${
                     node.filteringSourceJoinVariable
                       ? `
                   <div class="detail-row">
                     <span class="detail-label">Filtering</span>
                     <span class="detail-value font-mono">${typeof node.filteringSourceJoinVariable === "object" ? node.filteringSourceJoinVariable.name : node.filteringSourceJoinVariable}</span>
                   </div>`
                       : ""
                   }
                 </div>`;
            }

            const content = `
           <div class="detail-section">
             <div class="detail-section-title">Plan Node Info</div>
             <div class="detail-row">
               <span class="detail-label">Node ID</span>
               <span class="detail-value">${node.id}</span>
             </div>
             <div class="detail-row">
               <span class="detail-label">Type</span>
               <span class="detail-value">${node.type}</span>
             </div>
             <div class="detail-row">
               <span class="detail-label">Stage</span>
               <span class="detail-value">${node.stageId}</span>
             </div>
             ${
               node.isStageRoot
                 ? `
             <div class="detail-row">
               <span class="detail-label">Role</span>
               <span class="detail-value"><span class="badge">Stage Root</span></span>
             </div>
             `
                 : ""
             }
             ${
               node.isRemoteSource
                 ? `
             <div class="detail-row">
               <span class="detail-label">Exchange From</span>
               <span class="detail-value">Stage ${node.sourceFragmentIds.join(", ")}</span>
             </div>
             `
                 : ""
             }
             ${
               node.joinType && node.type === "Join"
                 ? `
             <div class="detail-row">
               <span class="detail-label">Join Type</span>
               <span class="detail-value">${node.joinType}</span>
             </div>
             `
                 : ""
             }
             ${
               node.aggregationType
                 ? `
             <div class="detail-row">
               <span class="detail-label">Aggregation Step</span>
               <span class="detail-value">${node.aggregationType}</span>
             </div>
             `
                 : ""
             }
           </div>

           ${nodeSpecificHtml}

           ${
             incomingEdges.length > 0
               ? `
           <div class="detail-section">
             <div class="detail-section-title">Data Sources (${incomingEdges.length})</div>
             ${incomingEdges
               .map((e) => {
                 const sourceNode = model.planNodes.find(
                   (n) => n.id === e.source,
                 );
                 return `
               <div class="detail-row" style="cursor: pointer;" onclick="App.showPlanNodeDetail('${e.source}')">
                 <span class="detail-label">${sourceNode ? sourceNode.type : "Unknown"}</span>
                 <span class="detail-value">Node ${e.source} ${e.type === "exchange" ? '<span class="badge primary">exchange</span>' : ""}</span>
               </div>
               `;
               })
               .join("")}
           </div>
           `
               : ""
           }

           ${
             outgoingEdges.length > 0
               ? `
           <div class="detail-section">
             <div class="detail-section-title">Data Targets (${outgoingEdges.length})</div>
             ${outgoingEdges
               .map((e) => {
                 const targetNode = model.planNodes.find(
                   (n) => n.id === e.target,
                 );
                 return `
               <div class="detail-row" style="cursor: pointer;" onclick="App.showPlanNodeDetail('${e.target}')">
                 <span class="detail-label">${targetNode ? targetNode.type : "Unknown"}</span>
                 <span class="detail-value">Node ${e.target} ${e.type === "exchange" ? '<span class="badge primary">exchange</span>' : ""}</span>
               </div>
               `;
               })
               .join("")}
           </div>
           `
               : ""
           }

           ${
             node.outputVariables.length > 0
               ? `
           <div class="detail-section">
             <div class="detail-section-title">Output Variables (${node.outputVariables.length})</div>
             <div style="max-height: 150px; overflow-y: auto;">
               ${node.outputVariables
                 .map(
                   (v) => `
               <div class="detail-row">
                 <span class="detail-value" style="font-family: var(--font-mono); font-size: var(--font-size-sm);">${Utils.escapeHtml(v)}</span>
               </div>
               `,
                 )
                 .join("")}
             </div>
           </div>
           `
               : ""
           }
         `;

            this.show(`${node.type} (Node ${node.id})`, content);
          },
        };

        // ==========================================================================
        // Application Controller
        // ==========================================================================

        const App = {
          model: null,
          currentView: "overview",
          // D3 selections for Plan view highlighting
          planSelections: null,
          planStageColors: null,
          // View linking state (controls cross-view highlighting)
          viewLinks: {
            timeline: { in: true, out: false },
            tree: { in: true, out: true },
            dag: { in: true, out: false },
          },

          init() {
            this.setupEventListeners();
          },

          setupEventListeners() {
            // File upload - main upload zone
            const uploadZone = document.getElementById("upload-zone");
            const fileInput = document.getElementById("file-input");
            const headerFileInput =
              document.getElementById("header-file-input");

            uploadZone.addEventListener("click", () => fileInput.click());

            uploadZone.addEventListener("dragover", (e) => {
              e.preventDefault();
              uploadZone.classList.add("drag-over");
            });

            uploadZone.addEventListener("dragleave", () => {
              uploadZone.classList.remove("drag-over");
            });

            uploadZone.addEventListener("drop", (e) => {
              e.preventDefault();
              uploadZone.classList.remove("drag-over");
              const file = e.dataTransfer.files[0];
              if (file) this.loadFile(file);
            });

            fileInput.addEventListener("change", (e) => {
              const file = e.target.files[0];
              if (file) this.loadFile(file);
            });

            // Header upload button
            headerFileInput.addEventListener("change", (e) => {
              const file = e.target.files[0];
              if (file) this.loadFile(file);
            });

            // Navigation
            document
              .querySelectorAll(".nav-item[data-view]")
              .forEach((item) => {
                item.addEventListener("click", () => {
                  this.switchView(item.dataset.view);
                });
              });

            // Load new file
            document
              .getElementById("load-new-file")
              .addEventListener("click", () => {
                this.reset();
              });

            // Detail panel close
            document
              .getElementById("detail-close")
              .addEventListener("click", () => {
                DetailPanel.hide();
              });
          },

          highlightSQL(sql) {
            // Escape HTML first
            let escaped = sql
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;");

            // SQL keywords
            const keywords = [
              "SELECT",
              "FROM",
              "WHERE",
              "AND",
              "OR",
              "NOT",
              "IN",
              "EXISTS",
              "JOIN",
              "LEFT",
              "RIGHT",
              "INNER",
              "OUTER",
              "FULL",
              "CROSS",
              "ON",
              "GROUP BY",
              "ORDER BY",
              "HAVING",
              "LIMIT",
              "OFFSET",
              "UNION",
              "INSERT",
              "INTO",
              "VALUES",
              "UPDATE",
              "SET",
              "DELETE",
              "CREATE",
              "TABLE",
              "INDEX",
              "VIEW",
              "DROP",
              "ALTER",
              "AS",
              "DISTINCT",
              "CASE",
              "WHEN",
              "THEN",
              "ELSE",
              "END",
              "NULL",
              "IS",
              "LIKE",
              "BETWEEN",
              "ALL",
              "ANY",
              "SOME",
              "TRUE",
              "FALSE",
              "ASC",
              "DESC",
              "WITH",
              "RECURSIVE",
              "OVER",
              "PARTITION BY",
              "ROWS",
              "RANGE",
              "UNBOUNDED",
              "PRECEDING",
              "FOLLOWING",
              "CURRENT ROW",
            ];

            // Highlight strings (single quotes)
            escaped = escaped.replace(
              /'([^']*?)'/g,
              "<span class=\"sql-string\">'$1'</span>",
            );

            // Highlight numbers
            escaped = escaped.replace(
              /\b(\d+\.?\d*)\b/g,
              '<span class="sql-number">$1</span>',
            );

            // Highlight keywords (case insensitive, whole words)
            keywords.forEach((kw) => {
              const regex = new RegExp(`\\b(${kw})\\b`, "gi");
              escaped = escaped.replace(
                regex,
                '<span class="sql-keyword">$1</span>',
              );
            });

            // Highlight common functions
            const functions = [
              "COUNT",
              "SUM",
              "AVG",
              "MIN",
              "MAX",
              "COALESCE",
              "NULLIF",
              "CAST",
              "CONVERT",
              "SUBSTRING",
              "CONCAT",
              "LENGTH",
              "UPPER",
              "LOWER",
              "TRIM",
              "ROUND",
              "FLOOR",
              "CEIL",
              "ABS",
              "NOW",
              "DATE",
              "YEAR",
              "MONTH",
              "DAY",
              "ROW_NUMBER",
              "RANK",
              "DENSE_RANK",
              "LAG",
              "LEAD",
              "FIRST_VALUE",
              "LAST_VALUE",
            ];
            functions.forEach((fn) => {
              const regex = new RegExp(`\\b(${fn})\\s*\\(`, "gi");
              escaped = escaped.replace(
                regex,
                '<span class="sql-function">$1</span>(',
              );
            });

            // Highlight comments
            escaped = escaped.replace(
              /(--.*?)(\n|$)/g,
              '<span class="sql-comment">$1</span>$2',
            );
            escaped = escaped.replace(
              /(\/\*[\s\S]*?\*\/)/g,
              '<span class="sql-comment">$1</span>',
            );

            return escaped;
          },

          async loadFile(file) {
            const errorEl = document.getElementById("upload-error");
            errorEl.classList.add("hidden");

            try {
              const text = await file.text();
              const rawData = JSON.parse(text);

              // Validate basic structure
              if (!rawData.query || !rawData.tasks) {
                throw new Error(
                  "Invalid metrics file: missing query or tasks data",
                );
              }

              // Build model
              this.model = ModelBuilder.build(rawData);

              // Update UI
              this.showDataView();

              // Switch to explain view by default
              this.switchView("explain");

              // Update header with query summary
              const querySummary = document.getElementById("query-summary");
              querySummary.classList.remove("hidden");

              document.getElementById("header-query-id").textContent =
                this.model.query.id;

              // Duration
              const duration = this.model.query.timing.elapsed || "N/A";
              document.getElementById("header-duration").textContent = duration;

              // SQL hover with syntax highlighting
              const sqlTooltip = document.getElementById("sql-tooltip");
              const sql = this.model.query.sql || "No SQL available";
              sqlTooltip.innerHTML = this.highlightSQL(sql);

              // Reset file inputs
              document.getElementById("file-input").value = "";
              document.getElementById("header-file-input").value = "";
            } catch (err) {
              console.error("Failed to load file:", err);
              errorEl.textContent = `Error: ${err.message}`;
              errorEl.classList.remove("hidden");
            }
          },

          showDataView() {
            document.getElementById("upload-screen").classList.add("hidden");
            document.getElementById("sidebar").classList.remove("hidden");
            document.getElementById("content-area").classList.remove("hidden");
          },

          reset() {
            this.model = null;
            document.getElementById("upload-screen").classList.remove("hidden");
            document.getElementById("sidebar").classList.add("hidden");
            document.getElementById("content-area").classList.add("hidden");
            document.getElementById("query-summary").classList.add("hidden");
            DetailPanel.hide();
            document.getElementById("file-input").value = "";
            document.getElementById("header-file-input").value = "";
          },

          switchView(viewName) {
            this.currentView = viewName;

            // Update nav
            document
              .querySelectorAll(".nav-item[data-view]")
              .forEach((item) => {
                item.classList.toggle("active", item.dataset.view === viewName);
              });

            // Update views
            document.querySelectorAll(".view").forEach((view) => {
              view.classList.toggle("active", view.id === `view-${viewName}`);
            });

            // Hide detail panel on view switch
            DetailPanel.hide();

            this.renderCurrentView();
          },

          renderCurrentView() {
            if (!this.model) return;

            const container = document.getElementById(
              `view-${this.currentView}`,
            );

            switch (this.currentView) {
              case "overview":
                Views.renderOverview(this.model, container);
                break;
              case "plan":
                Views.renderPlan(this.model, container);
                break;
              case "explain":
                Views.renderExplain(this.model, container);
                break;
              case "stages":
                Views.renderStages(this.model, container);
                break;
              case "tasks":
                Views.renderTasks(this.model, container);
                break;
              case "operators":
                Views.renderOperators(this.model, container);
                break;
              case "workers":
                Views.renderWorkers(this.model, container);
                break;
            }
          },

          // Detail panel methods (exposed globally for onclick handlers)
          showStageDetail(stageId) {
            DetailPanel.renderStage(this.model, stageId);
          },

          showTaskDetail(taskId) {
            DetailPanel.renderTask(this.model, taskId);
          },

          showOperatorDetail(operatorKey) {
            DetailPanel.renderOperator(this.model, operatorKey);
          },

          showWorkerDetail(workerId) {
            DetailPanel.renderWorker(this.model, workerId);
          },

          showPlanNodeDetail(nodeId) {
            DetailPanel.renderPlanNode(this.model, nodeId);
          },

          // Stage highlighting for Plan view - linked across timeline, legend, and graph
          highlightPlanStage(stageId) {
            if (!this.planSelections) return;

            const { node, link, edgeLabel, nodeById } = this.planSelections;

            // Highlight timeline row
            document.querySelectorAll(".stage-timeline-row").forEach((row) => {
              const rowStageId = parseInt(row.dataset.stageId, 10);
              const isMatch = rowStageId === stageId;
              row.style.background = isMatch
                ? "rgba(116, 0, 255, 0.15)"
                : "transparent";
              row.querySelectorAll(".stage-timeline-bar").forEach((bar) => {
                bar.style.opacity = isMatch ? 1 : 0.3;
              });
            });

            // Highlight legend badge
            document.querySelectorAll(".stage-legend-item").forEach((item) => {
              const itemStageId = parseInt(item.dataset.stageId, 10);
              item.style.transform =
                itemStageId === stageId ? "scale(1.1)" : "scale(0.9)";
              item.style.opacity = itemStageId === stageId ? 1 : 0.4;
            });

            // Highlight graph nodes and edges
            node.attr("opacity", (d) => (d.stageId === stageId ? 1 : 0.2));
            link.attr("opacity", (d) => {
              const srcNode = nodeById.get(d.source);
              const tgtNode = nodeById.get(d.target);
              const srcMatch = srcNode && srcNode.stageId === stageId;
              const tgtMatch = tgtNode && tgtNode.stageId === stageId;
              return srcMatch || tgtMatch ? 1 : 0.1;
            });
            edgeLabel.attr("opacity", (d) => {
              const srcNode = d.sourceNode;
              const tgtNode = d.targetNode;
              const srcMatch = srcNode && srcNode.stageId === stageId;
              const tgtMatch = tgtNode && tgtNode.stageId === stageId;
              return srcMatch || tgtMatch ? 1 : 0.1;
            });
          },

          unhighlightPlanStage() {
            if (!this.planSelections) return;

            const { node, link, edgeLabel } = this.planSelections;

            // Reset timeline rows
            document.querySelectorAll(".stage-timeline-row").forEach((row) => {
              row.style.background = "transparent";
              row.querySelectorAll(".stage-timeline-bar").forEach((bar) => {
                bar.style.opacity = 1;
              });
            });

            // Reset legend badges
            document.querySelectorAll(".stage-legend-item").forEach((item) => {
              item.style.transform = "scale(1)";
              item.style.opacity = 1;
            });

            // Reset graph nodes and edges
            node.attr("opacity", 1);
            link.attr("opacity", 1);
            edgeLabel.attr("opacity", 1);
          },

          // Explain view - linked highlighting between tree, DAG, and timeline
          highlightExplainNode(nodeId, scrollTree = true) {
            // Highlight in the timeline and scroll to it
            let timelineTargetEl = null;
            document
              .querySelectorAll(".explain-timeline-group")
              .forEach((el) => {
                const elNodeId = el.dataset.nodeId;
                if (elNodeId === nodeId) {
                  el.classList.add("highlighted");
                  timelineTargetEl = el;
                } else {
                  el.style.opacity = "0.5";
                }
              });

            // Scroll timeline to show highlighted row
            if (timelineTargetEl) {
              const timelineContent = document.querySelector(
                ".explain-timeline-content",
              );
              if (timelineContent) {
                const contentRect = timelineContent.getBoundingClientRect();
                const elRect = timelineTargetEl.getBoundingClientRect();
                // Only scroll if element is not fully visible
                if (
                  elRect.top < contentRect.top ||
                  elRect.bottom > contentRect.bottom
                ) {
                  timelineTargetEl.scrollIntoView({
                    behavior: "smooth",
                    block: "center",
                  });
                }
              }
            }

            // Highlight in the tree pane
            let targetEl = null;
            document.querySelectorAll(".explain-operator").forEach((el) => {
              const elNodeId = el.dataset.nodeId;
              if (elNodeId === nodeId) {
                el.classList.add("highlighted");
                targetEl = el;
              } else {
                el.style.opacity = "0.7";
              }
            });

            // Scroll tree pane to show highlighted element
            if (scrollTree && targetEl) {
              const treePane = document.querySelector(".explain-tree-pane");
              if (treePane) {
                const paneRect = treePane.getBoundingClientRect();
                const elRect = targetEl.getBoundingClientRect();
                // Only scroll if element is not fully visible
                if (
                  elRect.top < paneRect.top ||
                  elRect.bottom > paneRect.bottom
                ) {
                  targetEl.scrollIntoView({
                    behavior: "smooth",
                    block: "center",
                  });
                }
              }
            }

            // Highlight in the DAG
            if (this.explainDagSelections) {
              const {
                node,
                link,
                edgeLabel,
                nodeById,
                svg,
                zoom,
                width,
                height,
              } = this.explainDagSelections;

              let targetNode = null;
              node.each(function (d) {
                const el = d3.select(this);
                if (d.id === nodeId) {
                  el.attr("opacity", 1);
                  el.select(".node-rect")
                    .attr("stroke", "#fff")
                    .attr("stroke-width", 3);
                  targetNode = d;
                } else {
                  el.attr("opacity", 0.3);
                }
              });

              link.attr("opacity", (d) => {
                return d.source === nodeId || d.target === nodeId ? 1 : 0.15;
              });

              edgeLabel.attr("opacity", (d) => {
                return d.source === nodeId || d.target === nodeId ? 1 : 0.15;
              });

              // Pan DAG to center on highlighted node (when hovering from tree)
              if (!scrollTree && targetNode && svg && zoom) {
                const currentTransform = d3.zoomTransform(svg.node());
                const scale = currentTransform.k;
                const targetX = width / 2 - targetNode.x * scale;
                const targetY = height / 2 - targetNode.y * scale;
                svg
                  .transition()
                  .duration(300)
                  .call(
                    zoom.transform,
                    d3.zoomIdentity.translate(targetX, targetY).scale(scale),
                  );
              }
            }
          },

          unhighlightExplainNode() {
            // Reset timeline
            document
              .querySelectorAll(".explain-timeline-group")
              .forEach((el) => {
                el.classList.remove("highlighted");
                el.style.opacity = "";
              });

            // Reset tree pane
            document.querySelectorAll(".explain-operator").forEach((el) => {
              el.classList.remove("highlighted");
              el.style.opacity = "";
            });

            // Reset DAG
            if (this.explainDagSelections) {
              const { node, link, edgeLabel, stageColors } =
                this.explainDagSelections;

              node.each(function (d) {
                const el = d3.select(this);
                el.attr("opacity", 1);
                el.select(".node-rect")
                  .attr("stroke", stageColors?.[d.stageId] || "#4a9eff")
                  .attr("stroke-width", d.isRemoteSource ? 3 : 2);
              });

              link.attr("opacity", 1);
              edgeLabel.attr("opacity", 1);
            }
          },

          // Stage highlighting for Explain view - linked across timeline, tree, and DAG
          // source: 'timeline', 'tree', or 'dag' - indicates which view triggered the highlight
          highlightStage(stageId, source = null) {
            // Check if source view has "out" linking enabled
            const sourceOutEnabled =
              !source || this.viewLinks[source]?.out !== false;
            if (!sourceOutEnabled) return;

            // Highlight timeline row and scroll to it (skip if source is timeline or timeline "in" is disabled)
            const timelineInEnabled = this.viewLinks.timeline.in;
            if (source !== "timeline" && timelineInEnabled) {
              let targetTimelineEl = null;
              document
                .querySelectorAll(".explain-timeline-group")
                .forEach((el) => {
                  const elStageId = parseInt(el.dataset.stageId, 10);
                  if (elStageId === stageId) {
                    el.classList.add("highlighted");
                    targetTimelineEl = el;
                  } else {
                    el.style.opacity = "0.5";
                  }
                });

              // Scroll timeline to show highlighted stage
              if (targetTimelineEl) {
                const timelineContent = document.querySelector(
                  ".explain-timeline-content",
                );
                if (timelineContent) {
                  const contentRect = timelineContent.getBoundingClientRect();
                  const elRect = targetTimelineEl.getBoundingClientRect();
                  if (
                    elRect.top < contentRect.top ||
                    elRect.bottom > contentRect.bottom
                  ) {
                    targetTimelineEl.scrollIntoView({
                      behavior: "smooth",
                      block: "center",
                    });
                  }
                }
              }
            }

            // Highlight stages in tree pane and scroll to it (skip if source is tree or tree "in" is disabled)
            const treeInEnabled = this.viewLinks.tree.in;
            if (source !== "tree" && treeInEnabled) {
              let targetStageEl = null;
              document.querySelectorAll(".explain-stage").forEach((el) => {
                const elStageId = parseInt(el.dataset.stageId, 10);
                if (elStageId === stageId) {
                  el.style.boxShadow = "0 0 0 2px var(--rapids-purple)";
                  el.style.background = "rgba(116, 0, 255, 0.1)";
                  targetStageEl = el;
                } else {
                  // Don't dim - opacity compounds on nested stages
                  el.style.boxShadow = "";
                  el.style.background = "";
                }
              });

              // Scroll tree pane to show highlighted stage
              if (targetStageEl) {
                const treePane = document.querySelector(".explain-tree-pane");
                if (treePane) {
                  const paneRect = treePane.getBoundingClientRect();
                  const elRect = targetStageEl.getBoundingClientRect();
                  // Only scroll if element is not fully visible
                  if (
                    elRect.top < paneRect.top ||
                    elRect.bottom > paneRect.bottom
                  ) {
                    targetStageEl.scrollIntoView({
                      behavior: "smooth",
                      block: "center",
                    });
                  }
                }
              }
            }

            // Highlight in DAG (skip if source is dag or dag "in" is disabled)
            const dagInEnabled = this.viewLinks.dag.in;
            if (source !== "dag" && dagInEnabled && this.explainDagSelections) {
              const { node, link, edgeLabel, svg, zoom, width, height } =
                this.explainDagSelections;

              // Find the first node in this stage to pan to
              let targetNode = null;
              node.each(function (d) {
                const el = d3.select(this);
                if (d.stageId === stageId) {
                  el.attr("opacity", 1);
                  el.select(".node-rect")
                    .attr("stroke", "#fff")
                    .attr("stroke-width", 3);
                  if (!targetNode) targetNode = d;
                } else {
                  el.attr("opacity", 0.3);
                }
              });

              link.attr("opacity", (d) => {
                const sourceInStage =
                  d.sourceNode && d.sourceNode.stageId === stageId;
                const targetInStage =
                  d.targetNode && d.targetNode.stageId === stageId;
                return sourceInStage || targetInStage ? 1 : 0.15;
              });

              edgeLabel.attr("opacity", (d) => {
                const sourceInStage =
                  d.sourceNode && d.sourceNode.stageId === stageId;
                const targetInStage =
                  d.targetNode && d.targetNode.stageId === stageId;
                return sourceInStage || targetInStage ? 1 : 0.15;
              });

              // Pan DAG to center on the highlighted stage node
              if (targetNode && svg && zoom) {
                const currentTransform = d3.zoomTransform(svg.node());
                const scale = currentTransform.k;
                const targetX = width / 2 - targetNode.x * scale;
                const targetY = height / 2 - targetNode.y * scale;
                svg
                  .transition()
                  .duration(300)
                  .call(
                    zoom.transform,
                    d3.zoomIdentity.translate(targetX, targetY).scale(scale),
                  );
              }
            }
          },

          unhighlightStage() {
            // Reset timeline
            document
              .querySelectorAll(".explain-timeline-group")
              .forEach((el) => {
                el.classList.remove("highlighted");
                el.style.opacity = "";
              });

            // Reset tree pane
            document.querySelectorAll(".explain-stage").forEach((el) => {
              el.style.boxShadow = "";
              el.style.background = "";
            });

            // Reset DAG
            if (this.explainDagSelections) {
              const { node, link, edgeLabel, stageColors } =
                this.explainDagSelections;

              node.each(function (d) {
                const el = d3.select(this);
                el.attr("opacity", 1);
                el.select(".node-rect")
                  .attr("stroke", stageColors?.[d.stageId] || "#4a9eff")
                  .attr("stroke-width", d.isRemoteSource ? 3 : 2);
              });

              link.attr("opacity", 1);
              edgeLabel.attr("opacity", 1);
            }
          },

          // Plan node highlighting - links tree operators with DAG nodes
          // source: 'tree', 'dag', or 'timeline' - indicates which view triggered the highlight
          // linkedStageIds: optional array of source stage IDs for RemoteSource exchange linking
          highlightPlanNode(nodeId, source = null, linkedStageIds = null) {
            if (!nodeId) return;
            const nodeIdStr = String(nodeId);
            let stageId = null;

            // Check if source view has "out" linking enabled
            const sourceOutEnabled =
              !source || this.viewLinks[source]?.out !== false;
            if (!sourceOutEnabled) return;

            // Highlight operators in tree pane (skip if source is tree, or tree "in" is disabled)
            const treeInEnabled = this.viewLinks.tree.in;
            if (source !== "tree" && treeInEnabled) {
              let targetEl = null;
              document.querySelectorAll(".explain-operator").forEach((el) => {
                if (el.dataset.nodeId === nodeIdStr) {
                  el.classList.add("highlighted");
                  targetEl = el;
                  stageId = parseInt(el.dataset.stageId, 10);
                } else {
                  el.style.opacity = "0.5";
                }
              });

              // For RemoteSource: also highlight PartitionedOutput operators in source stages
              if (linkedStageIds && linkedStageIds.length > 0) {
                document.querySelectorAll(".explain-operator").forEach((el) => {
                  const elStageId = parseInt(el.dataset.stageId, 10);
                  if (linkedStageIds.includes(elStageId)) {
                    // Check if this operator contains a PartitionedOutput pipeline step
                    const hasPartitionedOutput =
                      el
                        .querySelector(".explain-operator-details")
                        ?.textContent?.includes("PartitionedOutput") ||
                      el
                        .querySelector(".explain-operator-type")
                        ?.textContent?.includes("Exchange");
                    if (hasPartitionedOutput) {
                      el.classList.add("exchange-link-highlight");
                      el.style.opacity = "";
                    }
                  }
                });
              }

              // Scroll tree pane to show highlighted operator
              if (targetEl) {
                const treePane = document.querySelector(".explain-tree-pane");
                if (treePane) {
                  const paneRect = treePane.getBoundingClientRect();
                  const elRect = targetEl.getBoundingClientRect();
                  if (
                    elRect.top < paneRect.top ||
                    elRect.bottom > paneRect.bottom
                  ) {
                    targetEl.scrollIntoView({
                      behavior: "smooth",
                      block: "center",
                    });
                  }
                }
              }
            }

            // Highlight in Explain view DAG (skip if source is dag, or dag "in" is disabled)
            const dagInEnabled = this.viewLinks.dag.in;
            if (source !== "dag" && dagInEnabled && this.explainDagSelections) {
              const { node, link, edgeLabel, svg, zoom, width, height } =
                this.explainDagSelections;

              let targetNode = null;
              node.each(function (d) {
                const el = d3.select(this);
                if (String(d.id) === nodeIdStr) {
                  el.attr("opacity", 1);
                  el.select(".node-rect")
                    .attr("stroke", "#fff")
                    .attr("stroke-width", 3);
                  targetNode = d;
                } else {
                  el.attr("opacity", 0.3);
                }
              });

              // Get stageId from DAG node if not already set
              if (targetNode && stageId === null) {
                stageId = targetNode.stageId;
              }

              link.attr("opacity", (d) => {
                return String(d.source) === nodeIdStr ||
                  String(d.target) === nodeIdStr
                  ? 1
                  : 0.15;
              });

              edgeLabel.attr("opacity", (d) => {
                return String(d.source) === nodeIdStr ||
                  String(d.target) === nodeIdStr
                  ? 1
                  : 0.15;
              });

              // Pan DAG to center on highlighted node
              if (targetNode && svg && zoom) {
                const currentTransform = d3.zoomTransform(svg.node());
                const scale = currentTransform.k;
                const targetX = width / 2 - targetNode.x * scale;
                const targetY = height / 2 - targetNode.y * scale;
                svg
                  .transition()
                  .duration(300)
                  .call(
                    zoom.transform,
                    d3.zoomIdentity.translate(targetX, targetY).scale(scale),
                  );
              }
            }

            // Highlight corresponding stage in timeline and scroll to it (skip if timeline "in" is disabled)
            const timelineInEnabled = this.viewLinks.timeline.in;
            if (
              stageId !== null &&
              source !== "timeline" &&
              timelineInEnabled
            ) {
              let targetTimelineEl = null;
              document
                .querySelectorAll(".explain-timeline-group")
                .forEach((el) => {
                  const elStageId = parseInt(el.dataset.stageId, 10);
                  if (elStageId === stageId) {
                    el.classList.add("highlighted");
                    targetTimelineEl = el;
                  } else {
                    el.style.opacity = "0.5";
                  }
                });

              // Scroll timeline to show highlighted stage
              if (targetTimelineEl) {
                const timelineContent = document.querySelector(
                  ".explain-timeline-content",
                );
                if (timelineContent) {
                  const contentRect = timelineContent.getBoundingClientRect();
                  const elRect = targetTimelineEl.getBoundingClientRect();
                  if (
                    elRect.top < contentRect.top ||
                    elRect.bottom > contentRect.bottom
                  ) {
                    targetTimelineEl.scrollIntoView({
                      behavior: "smooth",
                      block: "center",
                    });
                  }
                }
              }
            }

            // Also highlight in Plan view DAG if available (for Operators view)
            if (this.planSelections) {
              const { node, link, edgeLabel, nodeById } = this.planSelections;

              node.each(function (d) {
                const el = d3.select(this);
                if (String(d.id) === nodeIdStr) {
                  el.attr("opacity", 1);
                  el.select("rect")
                    .attr("stroke", "#fff")
                    .attr("stroke-width", 3);
                } else {
                  el.attr("opacity", 0.3);
                }
              });

              link.attr("opacity", (d) => {
                return String(d.source) === nodeIdStr ||
                  String(d.target) === nodeIdStr
                  ? 1
                  : 0.15;
              });

              edgeLabel.attr("opacity", (d) => {
                return String(d.source) === nodeIdStr ||
                  String(d.target) === nodeIdStr
                  ? 1
                  : 0.15;
              });
            }

            // Highlight rows in the operators table with same plan node
            document
              .querySelectorAll("#operators-table tbody tr")
              .forEach((row) => {
                if (row.dataset.planNodeId === nodeIdStr) {
                  row.style.background = "rgba(116, 0, 255, 0.15)";
                } else {
                  row.style.opacity = "0.5";
                }
              });
          },

          unhighlightPlanNode() {
            // Reset tree operators
            document.querySelectorAll(".explain-operator").forEach((el) => {
              el.classList.remove("highlighted");
              el.classList.remove("exchange-link-highlight");
              el.style.opacity = "";
            });

            // Reset timeline
            document
              .querySelectorAll(".explain-timeline-group")
              .forEach((el) => {
                el.classList.remove("highlighted");
                el.style.opacity = "";
              });

            // Reset Explain view DAG
            if (this.explainDagSelections) {
              const { node, link, edgeLabel, stageColors } =
                this.explainDagSelections;

              node.each(function (d) {
                const el = d3.select(this);
                el.attr("opacity", 1);
                el.select(".node-rect")
                  .attr("stroke", stageColors?.[d.stageId] || "#4a9eff")
                  .attr("stroke-width", d.isRemoteSource ? 3 : 2);
              });

              link.attr("opacity", 1);
              edgeLabel.attr("opacity", 1);
            }

            // Reset operators table
            document
              .querySelectorAll("#operators-table tbody tr")
              .forEach((row) => {
                row.style.background = "";
                row.style.opacity = "";
              });

            // Reset Plan view DAG
            if (this.planSelections) {
              const { node, link, edgeLabel } = this.planSelections;

              node.each(function (d) {
                const el = d3.select(this);
                el.attr("opacity", 1);
                el.select("rect")
                  .attr("stroke", d.isRemoteSource ? "#a78bfa" : "#1a1a2e")
                  .attr("stroke-width", d.isRemoteSource ? 3 : 2);
              });

              link.attr("opacity", 1);
              edgeLabel.attr("opacity", 1);
            }
          },
        };

        // Expose App globally for onclick handlers in dynamic HTML
        window.App = App;

        // Initialize on DOM ready
        document.addEventListener("DOMContentLoaded", () => App.init());
      })();
    </script>

    <!-- Command Palette -->
    <div class="command-palette-overlay" id="command-palette-overlay">
      <div class="command-palette">
        <div class="command-palette-input-wrapper">
          <span class="command-palette-icon">&#128269;</span>
          <input
            type="text"
            class="command-palette-input"
            id="command-palette-input"
            placeholder="Search for stages, operators, pipelines..."
            autocomplete="off"
            spellcheck="false"
          />
          <span class="command-palette-shortcut">ESC</span>
        </div>
        <div class="command-palette-results" id="command-palette-results">
          <div class="command-palette-empty">Start typing to search...</div>
        </div>
        <div class="command-palette-footer">
          <span><kbd>↑</kbd><kbd>↓</kbd> Navigate</span>
          <span><kbd>Enter</kbd> Select</span>
          <span><kbd>ESC</kbd> Close</span>
        </div>
      </div>
    </div>

    <script>
      // Command Palette functionality
      const CommandPalette = {
        overlay: null,
        input: null,
        results: null,
        selectedIndex: 0,
        items: [],

        init() {
          this.overlay = document.getElementById("command-palette-overlay");
          this.input = document.getElementById("command-palette-input");
          this.results = document.getElementById("command-palette-results");

          // Keyboard shortcut to open (Ctrl/Cmd + K)
          document.addEventListener("keydown", (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === "k") {
              e.preventDefault();
              this.open();
            }
            if (e.key === "Escape" && this.isOpen()) {
              this.close();
            }
          });

          // Close on overlay click
          this.overlay.addEventListener("click", (e) => {
            if (e.target === this.overlay) {
              this.close();
            }
          });

          // Input handling
          this.input.addEventListener("input", () =>
            this.search(this.input.value),
          );
          this.input.addEventListener("keydown", (e) => this.handleKeydown(e));
        },

        isOpen() {
          return this.overlay.classList.contains("visible");
        },

        open() {
          if (!window.App?.model) return;
          this.overlay.classList.add("visible");
          this.input.value = "";
          this.input.focus();
          this.search("");
        },

        close() {
          this.overlay.classList.remove("visible");
          this.input.value = "";
          this.selectedIndex = 0;
        },

        search(query) {
          const model = window.App?.model;
          if (!model) {
            this.results.innerHTML =
              '<div class="command-palette-empty">No data loaded</div>';
            return;
          }

          const q = query.toLowerCase().trim();
          this.items = [];

          // Search stages
          if (model.stages) {
            model.stages.forEach((stage, id) => {
              const stageName = `Stage ${id}`;
              const stageType = stage.rootNodeType || "";
              if (
                !q ||
                stageName.toLowerCase().includes(q) ||
                stageType.toLowerCase().includes(q) ||
                String(id).includes(q)
              ) {
                this.items.push({
                  type: "stage",
                  id: id,
                  title: stageName,
                  subtitle: stageType,
                  badge: `${stage.metrics?.taskCount || 0} tasks`,
                });
              }
            });
          }

          // Search plan nodes
          if (model.planNodes) {
            model.planNodes.forEach((node) => {
              const nodeType = node.type || "";
              const nodeId = String(node.id);
              if (
                !q ||
                nodeType.toLowerCase().includes(q) ||
                nodeId.includes(q)
              ) {
                this.items.push({
                  type: "plan",
                  id: node.id,
                  stageId: node.stageId,
                  title: `${nodeType} #${node.id}`,
                  subtitle: `Stage ${node.stageId}`,
                  badge: node.id,
                });
              }
            });
          }

          // Search pipelines (from operators)
          if (model.operators) {
            const pipelines = new Map();
            model.operators.forEach((op) => {
              const key = `${op.stageId}-${op.pipelineId}`;
              if (!pipelines.has(key)) {
                pipelines.set(key, {
                  stageId: op.stageId,
                  pipelineId: op.pipelineId,
                  operators: [],
                });
              }
              pipelines.get(key).operators.push(op);
            });

            pipelines.forEach((pipeline, key) => {
              const pipelineName = `Pipeline ${pipeline.stageId}.${pipeline.pipelineId}`;
              if (
                !q ||
                pipelineName.toLowerCase().includes(q) ||
                key.includes(q)
              ) {
                this.items.push({
                  type: "pipeline",
                  stageId: pipeline.stageId,
                  pipelineId: pipeline.pipelineId,
                  title: pipelineName,
                  subtitle: `${pipeline.operators.length} operators`,
                  badge: `S${pipeline.stageId}`,
                });
              }
            });
          }

          // Limit results
          this.items = this.items.slice(0, 50);
          this.selectedIndex = 0;
          this.render();
        },

        render() {
          if (this.items.length === 0) {
            this.results.innerHTML =
              '<div class="command-palette-empty">No results found</div>';
            return;
          }

          // Group by type
          const stages = this.items.filter((i) => i.type === "stage");
          const plans = this.items.filter((i) => i.type === "plan");
          const pipelines = this.items.filter((i) => i.type === "pipeline");

          let html = "";
          let globalIndex = 0;

          const renderGroup = (title, items, iconClass) => {
            if (items.length === 0) return "";
            let groupHtml = `<div class="command-palette-group">`;
            groupHtml += `<div class="command-palette-group-title">${title}</div>`;
            items.forEach((item) => {
              const selected =
                globalIndex === this.selectedIndex ? "selected" : "";
              groupHtml += `
                <div class="command-palette-item ${selected}" data-index="${globalIndex}">
                  <div class="command-palette-item-icon ${item.type}">${item.type === "stage" ? "S" : item.type === "plan" ? "P" : "L"}</div>
                  <div class="command-palette-item-content">
                    <div class="command-palette-item-title">${item.title}</div>
                    <div class="command-palette-item-subtitle">${item.subtitle}</div>
                  </div>
                  <div class="command-palette-item-badge">${item.badge}</div>
                </div>
              `;
              globalIndex++;
            });
            groupHtml += `</div>`;
            return groupHtml;
          };

          html += renderGroup("Stages", stages, "stage");
          html += renderGroup("Plan Nodes", plans, "plan");
          html += renderGroup("Pipelines", pipelines, "pipeline");

          this.results.innerHTML = html;

          // Add click handlers
          this.results
            .querySelectorAll(".command-palette-item")
            .forEach((el) => {
              el.addEventListener("click", () => {
                this.selectedIndex = parseInt(el.dataset.index, 10);
                this.selectCurrent();
              });
            });

          // Scroll selected into view
          const selectedEl = this.results.querySelector(
            ".command-palette-item.selected",
          );
          if (selectedEl) {
            selectedEl.scrollIntoView({ block: "nearest" });
          }
        },

        handleKeydown(e) {
          if (e.key === "ArrowDown") {
            e.preventDefault();
            this.selectedIndex = Math.min(
              this.selectedIndex + 1,
              this.items.length - 1,
            );
            this.render();
          } else if (e.key === "ArrowUp") {
            e.preventDefault();
            this.selectedIndex = Math.max(this.selectedIndex - 1, 0);
            this.render();
          } else if (e.key === "Enter") {
            e.preventDefault();
            this.selectCurrent();
          }
        },

        selectCurrent() {
          const item = this.items[this.selectedIndex];
          if (!item) return;

          this.close();

          if (item.type === "stage") {
            this.navigateToStage(item.id);
          } else if (item.type === "plan") {
            this.navigateToPlanNode(item.id, item.stageId);
          } else if (item.type === "pipeline") {
            this.navigateToPipeline(item.stageId, item.pipelineId);
          }
        },

        navigateToStage(stageId) {
          // Switch to Explain view and highlight stage
          if (window.App.currentView !== "explain") {
            window.App.showExplain();
          }

          // Highlight the stage in timeline
          setTimeout(() => {
            const timelineBar = document.querySelector(
              `.explain-timeline-bar[data-stage-id="${stageId}"]`,
            );
            if (timelineBar) {
              timelineBar.scrollIntoView({
                behavior: "smooth",
                block: "center",
              });
              timelineBar.click();
            }
          }, 100);
        },

        navigateToPlanNode(nodeId, stageId) {
          // Switch to Explain view
          if (window.App.currentView !== "explain") {
            window.App.showExplain();
          }

          setTimeout(() => {
            // Find and click the tree node
            const treeNode = document.querySelector(
              `.explain-tree-node[data-node-id="${nodeId}"]`,
            );
            if (treeNode) {
              treeNode.scrollIntoView({ behavior: "smooth", block: "center" });
              treeNode.click();
            }

            // Also highlight in DAG
            if (window.App.highlightPlanNode) {
              window.App.highlightPlanNode(nodeId, false);
            }
          }, 100);
        },

        navigateToPipeline(stageId, pipelineId) {
          // Switch to Stages view and show stage detail
          window.App.showStageDetail(stageId);

          setTimeout(() => {
            // Find and scroll to pipeline section
            const pipelineHeader = document.querySelector(
              `[data-pipeline-id="${pipelineId}"]`,
            );
            if (pipelineHeader) {
              pipelineHeader.scrollIntoView({
                behavior: "smooth",
                block: "start",
              });
            }
          }, 100);
        },
      };

      // Initialize command palette after DOM ready
      document.addEventListener("DOMContentLoaded", () =>
        CommandPalette.init(),
      );
    </script>
  </body>
